<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nahara & ??? — The Haunted Birthday</title>

<script>

/* =========================================================
   NAHARA & ???
   ACTO II — THE HAUNTED MANSION
   SISTEMA DE COMBATE
   ========================================================= */


/* =========================================================
   CONFIGURACIÓN DEL ACTO II
   ========================================================= */

const ACT2 = {

    active: false,

    health: 3,
    maxHealth: 3,

    invulnerable: false,

    checkpointX: 240,
    checkpointBottom: GROUND_Y,

    currentCheckpoint: 0,

    canShoot: true,

    projectiles: [],

    introShown: false,

    completed: false

};


/* =========================================================
   ENEMIGOS
   ========================================================= */

ACT2.enemies = [

    {
        selector: ".enemy1",

        x: 1600,
        baseX: 1600,

        bottom: 300,

        hp: 2,
        maxHp: 2,

        alive: true,

        direction: 1,

        speed: 1.1,

        range: 140
    },


    {
        selector: ".enemy2",

        x: 2900,
        baseX: 2900,

        bottom: 390,

        hp: 2,
        maxHp: 2,

        alive: true,

        direction: -1,

        speed: 1.2,

        range: 170
    },


    {
        selector: ".enemy3",

        x: 4200,
        baseX: 4200,

        bottom: 310,

        hp: 2,
        maxHp: 2,

        alive: true,

        direction: 1,

        speed: 1.3,

        range: 180
    }

];


/* =========================================================
   CHECKPOINTS
   ========================================================= */

ACT2.checkpoints = [

    {
        x: 1850,
        respawnX: 1800
    },

    {
        x: 3350,
        respawnX: 3300
    }

];


/* =========================================================
   INICIAR ACTO II
   ========================================================= */

function startAct2(){

    ACT2.active = true;

    ACT2.health = 3;

    ACT2.completed = false;

    updateAct2Hearts();


    ACT2.enemies.forEach(enemy => {

        enemy.element =
            document.querySelector(
                enemy.selector
            );

    });


    setTimeout(() => {

        showDialogue(
            "Tengo una sensación horrible sobre este pasillo."
        );

    }, 1200);


    setTimeout(() => {

        showDialogue(
            "Si algo intenta comernos, presiona F."
        );

    }, 4200);

}


/* =========================================================
   ATAQUE DE NAHARA
   ========================================================= */

function act2Shoot(){

    if(
        !ACT2.active ||
        ending ||
        !ACT2.canShoot
    ){
        return;
    }


    ACT2.canShoot = false;


    setTimeout(() => {

        ACT2.canShoot = true;

    }, 280);


    const projectile =
        document.createElement("div");


    projectile.className =
        "naharaProjectile";


    const direction =
        facingRight ? 1 : -1;


    const startX =
        playerX +
        (
            facingRight
            ? 75
            : -15
        );


    const startBottom =
        playerBottom + 75;


    projectile.style.left =
        startX + "px";


    projectile.style.bottom =
        startBottom + "px";


    world.appendChild(
        projectile
    );


    ACT2.projectiles.push({

        element: projectile,

        x: startX,

        bottom: startBottom,

        velocityX:
            direction * 13,

        life: 0

    });

}


/* =========================================================
   TECLA DE ATAQUE
   ========================================================= */

window.addEventListener(
    "keydown",

    event => {

        if(
            event.code === "KeyF" &&
            !event.repeat
        ){

            act2Shoot();

        }

    }
);


/* =========================================================
   ACTUALIZAR PROYECTILES
   ========================================================= */

function updateAct2Projectiles(){

    for(
        let i =
            ACT2.projectiles.length - 1;

        i >= 0;

        i--
    ){

        const projectile =
            ACT2.projectiles[i];


        projectile.x +=
            projectile.velocityX;


        projectile.life++;


        projectile.element.style.left =
            projectile.x + "px";


        let removeProjectile =
            false;


        if(
            projectile.life > 100 ||
            projectile.x < 0 ||
            projectile.x > WORLD_WIDTH
        ){

            removeProjectile =
                true;

        }


        for(
            const enemy
            of ACT2.enemies
        ){

            if(!enemy.alive)
                continue;


            const collision =

                projectile.x + 30
                    > enemy.x

                &&

                projectile.x
                    < enemy.x + 70

                &&

                projectile.bottom + 30
                    > enemy.bottom

                &&

                projectile.bottom
                    < enemy.bottom + 80;


            if(collision){

                damageAct2Enemy(
                    enemy
                );


                removeProjectile =
                    true;


                break;

            }

        }


        if(removeProjectile){

            projectile.element.remove();


            ACT2.projectiles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   DAÑO A ENEMIGOS
   ========================================================= */

function damageAct2Enemy(enemy){

    if(!enemy.alive)
        return;


    enemy.hp--;


    enemy.element.classList.add(
        "enemyHit"
    );


    setTimeout(() => {

        enemy.element.classList.remove(
            "enemyHit"
        );

    }, 130);


    if(enemy.hp <= 0){

        defeatAct2Enemy(
            enemy
        );

    }

}


/* =========================================================
   DERROTAR ENEMIGO
   ========================================================= */

function defeatAct2Enemy(enemy){

    enemy.alive =
        false;


    enemy.element.classList.add(
        "enemyDefeated"
    );


    setTimeout(() => {

        enemy.element.style.display =
            "none";

    }, 350);

}


/* =========================================================
   MOVIMIENTO DE ENEMIGOS
   ========================================================= */

function updateAct2Enemies(){

    for(
        const enemy
        of ACT2.enemies
    ){

        if(
            !enemy.alive ||
            !enemy.element
        ){
            continue;
        }


        enemy.x +=

            enemy.speed *
            enemy.direction;


        if(
            enemy.x >
            enemy.baseX +
            enemy.range
        ){

            enemy.x =
                enemy.baseX +
                enemy.range;


            enemy.direction =
                -1;

        }


        if(
            enemy.x <
            enemy.baseX -
            enemy.range
        ){

            enemy.x =
                enemy.baseX -
                enemy.range;


            enemy.direction =
                1;

        }


        enemy.element.style.left =
            enemy.x + "px";


        checkAct2EnemyCollision(
            enemy
        );

    }

}


/* =========================================================
   COLISIÓN ENEMIGO / NAHARA
   ========================================================= */

function checkAct2EnemyCollision(
    enemy
){

    if(
        ACT2.invulnerable ||
        !enemy.alive
    ){
        return;
    }


    const touching =

        playerX +
        PLAYER_WIDTH -
        15
            > enemy.x

        &&

        playerX + 15
            < enemy.x + 70

        &&

        playerBottom +
        PLAYER_HEIGHT -
        20
            > enemy.bottom

        &&

        playerBottom
            < enemy.bottom + 80;


    if(touching){

        damageNaharaAct2();

    }

}


/* =========================================================
   DAÑO A NAHARA
   ========================================================= */

function damageNaharaAct2(){

    if(
        ACT2.invulnerable ||
        ACT2.health <= 0
    ){
        return;
    }


    ACT2.health--;


    updateAct2Hearts();


    ACT2.invulnerable =
        true;


    nahara.classList.add(
        "naharaHurt"
    );


    /* pequeño empujón */

    if(facingRight){

        playerX -= 80;

    }else{

        playerX += 80;

    }


    velocityY = 7;


    if(ACT2.health <= 0){

        setTimeout(() => {

            respawnAct2();

        }, 600);


        return;

    }


    setTimeout(() => {

        ACT2.invulnerable =
            false;


        nahara.classList.remove(
            "naharaHurt"
        );

    }, 1300);

}


/* =========================================================
   CORAZONES
   ========================================================= */

function updateAct2Hearts(){

    const hearts =
        document.querySelectorAll(
            ".heart"
        );


    hearts.forEach(
        (heart, index) => {

            if(
                index <
                ACT2.health
            ){

                heart.classList.remove(
                    "heartLost"
                );

            }else{

                heart.classList.add(
                    "heartLost"
                );

            }

        }
    );

}


/* =========================================================
   CHECKPOINTS
   ========================================================= */

function updateAct2Checkpoints(){

    if(
        ACT2.currentCheckpoint >=
        ACT2.checkpoints.length
    ){
        return;
    }


    const checkpoint =

        ACT2.checkpoints[
            ACT2.currentCheckpoint
        ];


    if(
        playerX >=
        checkpoint.x
    ){

        ACT2.checkpointX =
            checkpoint.respawnX;


        ACT2.checkpointBottom =
            GROUND_Y;


        ACT2.currentCheckpoint++;


        showAct2Checkpoint();


        showDialogue(
            "Bien. Si algo sale mal, volvemos desde aquí."
        );

    }

}


/* =========================================================
   AVISO CHECKPOINT
   ========================================================= */

function showAct2Checkpoint(){

    const notice =

        document.getElementById(
            "checkpointNotice"
        );


    if(!notice)
        return;


    notice.classList.add(
        "show"
    );


    setTimeout(() => {

        notice.classList.remove(
            "show"
        );

    }, 1500);

}


/* =========================================================
   RESPAWN
   ========================================================= */

function respawnAct2(){

    ACT2.health =
        ACT2.maxHealth;


    updateAct2Hearts();


    playerX =
        ACT2.checkpointX;


    playerBottom =
        ACT2.checkpointBottom;


    velocityY = 0;


    /* eliminar proyectiles */

    ACT2.projectiles.forEach(
        projectile => {

            projectile.element.remove();

        }
    );


    ACT2.projectiles = [];


    /* revivir enemigos */

    ACT2.enemies.forEach(
        enemy => {

            enemy.hp =
                enemy.maxHp;


            enemy.alive =
                true;


            enemy.x =
                enemy.baseX;


            if(enemy.element){

                enemy.element.style.display =
                    "block";


                enemy.element.classList.remove(
                    "enemyDefeated"
                );

            }

        }
    );


    nahara.classList.remove(
        "naharaHurt"
    );


    ACT2.invulnerable =
        true;


    showDialogue(
        "Nope. Todavía no terminamos."
    );


    setTimeout(() => {

        ACT2.invulnerable =
            false;

    }, 1400);

}


/* =========================================================
   INTRODUCCIÓN AL COMBATE
   ========================================================= */

function updateAct2CombatIntro(){

    if(
        ACT2.introShown ||
        playerX < 1250
    ){
        return;
    }


    ACT2.introShown =
        true;


    showDialogue(
        "Nahara... prueba presionando F. Por si acaso."
    );


    const hint =

        document.getElementById(
            "attackHint"
        );


    if(hint){

        hint.classList.add(
            "show"
        );


        setTimeout(() => {

            hint.classList.remove(
                "show"
            );

        }, 4500);

    }

}


/* =========================================================
   ACTUALIZACIÓN GENERAL DEL ACTO II
   ========================================================= */

function updateAct2(){

    if(
        !ACT2.active ||
        ACT2.completed
    ){
        return;
    }


    updateAct2CombatIntro();

    updateAct2Checkpoints();

    updateAct2Enemies();

    updateAct2Projectiles();

}


/* =========================================================
   FINALIZAR ACTO II
   ========================================================= */

function finishAct2(){

    if(ACT2.completed)
        return;


    ACT2.completed =
        true;


    ACT2.active =
        false;


    showDialogue(
        "Esa puerta... definitivamente no estaba ahí antes."
    );


    /*
       Después conectaremos aquí:

       transitionToAct3();

       ACTO III —
       THE CURSED CINEMA
    */

}
          

          
  /* =========================================================
   ACTO II — COMBATE
   ========================================================= */


/* ATAQUE DE NAHARA */

.naharaProjectile{

    position:absolute;

    width:30px;
    height:30px;

    z-index:70;

    background:#d9a4b5;

    clip-path:
        polygon(
            50% 0%,
            61% 35%,
            98% 35%,
            68% 57%,
            79% 94%,
            50% 72%,
            21% 94%,
            32% 57%,
            2% 35%,
            39% 35%
        );

    filter:
        drop-shadow(
            0 0 8px
            rgba(220,160,180,.9)
        );

    animation:
        projectileSpin
        .35s linear infinite;
}


@keyframes projectileSpin{

    from{
        transform:
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg);
    }

}


/* ENEMIGO RECIBE GOLPE */

.enemyHit{

    filter:
        brightness(2.5)
        drop-shadow(
            0 0 10px
            #d9a4b5
        ) !important;

}


/* ENEMIGO DERROTADO */

.enemyDefeated{

    animation:
        enemyDeath
        .35s forwards !important;

}


@keyframes enemyDeath{

    0%{

        opacity:1;

        transform:
            scale(1)
            rotate(0);

    }

    50%{

        transform:
            scale(1.3)
            rotate(15deg);

    }

    100%{

        opacity:0;

        transform:
            scale(.1)
            rotate(80deg);

    }

}


/* NAHARA RECIBE DAÑO */

.naharaHurt{

    animation:
        naharaDamage
        .15s steps(2)
        infinite !important;

}


@keyframes naharaDamage{

    0%{
        opacity:1;
    }

    50%{
        opacity:.2;
    }

    100%{
        opacity:1;
    }

}


/* CORAZÓN PERDIDO */

.heartLost,
.heartLost::before,
.heartLost::after{

    background:
        #38242b !important;

}


/* CHECKPOINT */

#checkpointNotice{

    position:absolute;

    left:50%;
    top:110px;

    transform:
        translateX(-50%)
        translateY(-15px);

    z-index:350;

    padding:
        10px 25px;

    background:
        rgba(10,6,9,.9);

    color:#d9b4bb;

    border:
        3px solid
        #805262;

    border-radius:50%;

    font-size:14px;

    letter-spacing:4px;

    opacity:0;

    pointer-events:none;

    transition:.4s;

}


#checkpointNotice.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);

}


/* INDICACIÓN DE ATAQUE */

#attackHint{

    position:absolute;

    left:50%;
    bottom:20px;

    transform:
        translateX(-50%);

    z-index:400;

    padding:
        10px 22px;

    background:
        rgba(5,3,4,.8);

    color:#c9a3ad;

    border:
        2px solid
        #57323f;

    border-radius:30px;

    font-size:13px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;

    transition:.4s;

}


#attackHint.show{

    opacity:1;

}

           <div id="checkpointNotice">
    CHECKPOINT
</div>

<div id="attackHint">
    F — ATAQUE
</div>
          

  /* =========================================================
   NAHARA & ???
   ACTO III — THE CURSED CINEMA
   ========================================================= */

const ACT3 = {

    active:false,
    completed:false,

    startX:0,

    fragments:0,
    totalFragments:3,

    blackoutTriggered:false,
    shadowTriggered:false,
    screenTriggered:false,

    exitUnlocked:false
};


/* =========================================================
   INICIAR ACTO III
   ========================================================= */

function startAct3(){

    ACT3.active = true;
    ACT3.completed = false;

    ACT3.fragments = 0;

    ACT3.blackoutTriggered = false;
    ACT3.shadowTriggered = false;
    ACT3.screenTriggered = false;

    ACT3.exitUnlocked = false;


    document
        .getElementById("act3Scene")
        .classList.add("active");


    playerX = 180;

    playerBottom =
        GROUND_Y;

    velocityY = 0;


    setTimeout(() => {

        showDialogue(
            "¿Un cine?"
        );

    },800);


    setTimeout(() => {

        showDialogue(
            "Perfecto. Porque nada malo pasa jamás en cines abandonados."
        );

    },3400);


    setTimeout(() => {

        showDialogue(
            "Necesitamos encontrar tres fragmentos de película."
        );

    },6500);

}


/* =========================================================
   FRAGMENTOS DE PELÍCULA
   ========================================================= */

const act3Fragments = [

    {
        id:"filmFragment1",
        collected:false
    },

    {
        id:"filmFragment2",
        collected:false
    },

    {
        id:"filmFragment3",
        collected:false
    }

];


function collectAct3Fragment(
    fragment
){

    if(fragment.collected)
        return;


    fragment.collected = true;


    const element =
        document.getElementById(
            fragment.id
        );


    if(element){

        element.classList.add(
            "collected"
        );

    }


    ACT3.fragments++;


    updateAct3FragmentCounter();


    if(ACT3.fragments === 1){

        showDialogue(
            "Uno. Definitivamente huele a película vieja."
        );

    }


    if(ACT3.fragments === 2){

        showDialogue(
            "Dos. Me preocupa mucho que esto esté funcionando."
        );

    }


    if(ACT3.fragments === 3){

        showDialogue(
            "Tres... Nahara, la pantalla acaba de encenderse sola."
        );


        ACT3.exitUnlocked =
            true;


        triggerAct3MovieScreen();

    }

}


/* =========================================================
   CONTADOR
   ========================================================= */

function updateAct3FragmentCounter(){

    const counter =
        document.getElementById(
            "filmFragmentCount"
        );


    if(counter){

        counter.textContent =
            ACT3.fragments;

    }

}


/* =========================================================
   DETECTAR FRAGMENTOS
   ========================================================= */

function checkAct3Fragments(){

    const positions = [

        {
            fragment:
                act3Fragments[0],

            x:900,

            bottom:330
        },

        {
            fragment:
                act3Fragments[1],

            x:2050,

            bottom:430
        },

        {
            fragment:
                act3Fragments[2],

            x:3450,

            bottom:300
        }

    ];


    positions.forEach(
        item => {

            if(
                item.fragment.collected
            ){
                return;
            }


            const dx =
                Math.abs(
                    playerX -
                    item.x
                );


            const dy =
                Math.abs(
                    playerBottom -
                    item.bottom
                );


            if(
                dx < 70 &&
                dy < 100
            ){

                collectAct3Fragment(
                    item.fragment
                );

            }

        }
    );

}


/* =========================================================
   PRIMER EVENTO:
   APAGÓN
   ========================================================= */

function triggerAct3Blackout(){

    if(
        ACT3.blackoutTriggered
    ){
        return;
    }


    ACT3.blackoutTriggered =
        true;


    const darkness =
        document.getElementById(
            "cinemaBlackout"
        );


    darkness.classList.add(
        "active"
    );


    showDialogue(
        "...Eso no fui yo."
    );


    setTimeout(() => {

        darkness.classList.remove(
            "active"
        );

    },1800);

}


/* =========================================================
   SEGUNDO EVENTO:
   SOMBRA
   ========================================================= */

function triggerAct3Shadow(){

    if(
        ACT3.shadowTriggered
    ){
        return;
    }


    ACT3.shadowTriggered =
        true;


    const shadow =
        document.getElementById(
            "cinemaShadow"
        );


    shadow.classList.add(
        "appear"
    );


    setTimeout(() => {

        shadow.classList.remove(
            "appear"
        );

    },1100);


    setTimeout(() => {

        showDialogue(
            "No."
        );

    },1400);


    setTimeout(() => {

        showDialogue(
            "No vamos a hablar de lo que acabamos de ver."
        );

    },3900);

}


/* =========================================================
   PANTALLA DEL CINE
   ========================================================= */

function triggerAct3MovieScreen(){

    if(ACT3.screenTriggered)
        return;


    ACT3.screenTriggered =
        true;


    const screen =
        document.getElementById(
            "cursedScreen"
        );


    screen.classList.add(
        "awake"
    );


    setTimeout(() => {

        showDialogue(
            "Nahara..."
        );

    },1000);


    setTimeout(() => {

        showDialogue(
            "La película tiene tu nombre."
        );

    },3200);

}


/* =========================================================
   EVENTOS POR POSICIÓN
   ========================================================= */

function updateAct3Events(){

    if(
        playerX > 1350 &&
        !ACT3.blackoutTriggered
    ){

        triggerAct3Blackout();

    }


    if(
        playerX > 2700 &&
        !ACT3.shadowTriggered
    ){

        triggerAct3Shadow();

    }

}


/* =========================================================
   PUERTA DE SALIDA
   ========================================================= */

function checkAct3Exit(){

    if(
        playerX < 4050
    ){
        return;
    }


    if(
        !ACT3.exitUnlocked
    ){

        playerX =
            4020;


        showDialogue(
            "Está cerrada. Nos falta algo."
        );


        return;

    }


    finishAct3();

}


/* =========================================================
   TERMINAR ACTO III
   ========================================================= */

function finishAct3(){

    if(ACT3.completed)
        return;


    ACT3.completed =
        true;


    ACT3.active =
        false;


    showDialogue(
        "La puerta se abrió."
    );


    setTimeout(() => {

        showDialogue(
            "¿Por qué siento que lo siguiente va a ser peor?"
        );

    },2600);


    setTimeout(() => {

        /*
           MÁS ADELANTE:

           transitionToAct4();

           ACTO IV —
           THE VAMPIRE'S CASTLE
        */

    },5500);

}


/* =========================================================
   LOOP DEL ACTO III
   ========================================================= */

function updateAct3(){

    if(
        !ACT3.active ||
        ACT3.completed
    ){
        return;
    }


    checkAct3Fragments();

    updateAct3Events();

    checkAct3Exit();

}

          /* =========================================================
   ACTO III — THE CURSED CINEMA
   ========================================================= */


#act3Scene{

    position:absolute;

    width:4300px;
    height:100%;

    display:none;

    overflow:hidden;

    background:

        radial-gradient(
            ellipse at 80% 40%,
            rgba(116,72,82,.13),
            transparent 35%
        ),

        linear-gradient(
            to bottom,
            #21151b,
            #100a0e 70%,
            #050304
        );

}


#act3Scene.active{

    display:block;

}


/* =========================================================
   PAREDES DEL CINE
   ========================================================= */

.cinemaWall{

    position:absolute;

    inset:0;

    background:

        repeating-linear-gradient(
            90deg,

            rgba(82,45,58,.15)
            0 80px,

            rgba(15,8,12,.15)
            80px 160px
        );

}


/* =========================================================
   PANTALLA
   ========================================================= */

#cursedScreen{

    position:absolute;

    width:680px;
    height:390px;

    left:3500px;
    bottom:260px;

    background:#c7b9a6;

    border:
        20px solid
        #140b10;

    box-shadow:

        0 0 0 8px
        #4b2c36,

        inset 0 0 80px
        rgba(0,0,0,.65);

    overflow:hidden;

}


#cursedScreen::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        repeating-linear-gradient(
            0deg,

            transparent
            0 5px,

            rgba(0,0,0,.15)

};

ACT4.bats = [

    },

    },

];


/* =========================================================
   MINI BOSS

ACT4.boss = {

    element:null,

/* =========================================================
   INICIAR ACTO IV
   ========================================================= */

function startAct4(){

    ACT4.active = true;
    ACT4.completed = false;

    ACT4.batsDefeated = 0;

    ACT4.bossStarted = false;
    ACT4.bossDefeated = false;

    ACT4.gateUnlocked = false;


    document
        .getElementById("act4Scene")
        .classList.add("active");


    ACT4.bats.forEach(bat => {

        bat.element =
            document.getElementById(
                bat.id
            );

    });


    ACT4.boss.element =
        document.getElementById(
            "vampireBoss"
        );


    playerX = 180;

    playerBottom =
        GROUND_Y;

    velocityY = 0;


    setTimeout(() => {

        showDialogue(
            "Oh."
        );

    },700);


    setTimeout(() => {

        showDialogue(
            "Ataúdes."
        );

    },2200);


    setTimeout(() => {

        showDialogue(
            "Muchísimos ataúdes."
        );

    },3900);


    setTimeout(() => {

        showDialogue(
            "Nahara, tengo una teoría y no me gusta."
        );

    },6200);

}


/* =========================================================
   MURCIÉLAGOS
   ========================================================= */

function updateAct4Bats(){

    for(
        const bat
        of ACT4.bats
    ){

        if(
            !bat.alive ||
            !bat.element
        ){
            continue;
        }


        bat.x +=
            bat.speed *
            bat.direction;


        if(
            bat.x >
            bat.baseX + bat.range
        ){

            bat.direction = -1;

        }


        if(
            bat.x <
            bat.baseX - bat.range
        ){

            bat.direction = 1;

        }


        bat.element.style.left =
            bat.x + "px";


        /* SEGUIR UN POCO A NAHARA */

        const distance =
            playerX - bat.x;


        if(
            Math.abs(distance) < 350
        ){

            bat.x +=
                Math.sign(distance)
                * .7;

        }


        checkAct4BatCollision(
            bat
        );

    }

}


/* =========================================================
   COLISIÓN MURCIÉLAGO
   ========================================================= */

function checkAct4BatCollision(
    bat
){

    if(ACT2.invulnerable)
        return;


    const hit =

        playerX +
        PLAYER_WIDTH - 15
            > bat.x

        &&

        playerX + 15
            < bat.x + 65

        &&

        playerBottom +
        PLAYER_HEIGHT
            > bat.bottom

        &&

        playerBottom
            < bat.bottom + 60;


    if(hit){

        damageNaharaAct2();

    }

}


/* =========================================================
   DAÑO DE DISPARO A MURCIÉLAGO
   ========================================================= */

function checkAct4ProjectileHits(){

    for(
        let i =
            ACT2.projectiles.length - 1;

        i >= 0;

        i--
    ){

        const projectile =
            ACT2.projectiles[i];


        let projectileUsed =
            false;


        /* MURCIÉLAGOS */

        for(
            const bat
            of ACT4.bats
        ){

            if(!bat.alive)
                continue;


            const hit =

                projectile.x + 30
                    > bat.x

                &&

                projectile.x
                    < bat.x + 65

                &&

                projectile.bottom + 30
                    > bat.bottom

                &&

                projectile.bottom
                    < bat.bottom + 60;


            if(hit){

                defeatAct4Bat(
                    bat
                );


                projectileUsed =
                    true;


                break;

            }

        }


        /* BOSS */

        if(
            !projectileUsed &&
            ACT4.bossStarted &&
            ACT4.boss.alive
        ){

            const boss =
                ACT4.boss;


            const bossHit =

                projectile.x + 30
                    > boss.x

                &&

                projectile.x
                    < boss.x + 130

                &&

                projectile.bottom + 30
                    > boss.bottom

                &&

                projectile.bottom
                    < boss.bottom + 190;


            if(bossHit){

                damageAct4Boss();

                projectileUsed =
                    true;

            }

        }


        if(projectileUsed){

            projectile.element.remove();


            ACT2.projectiles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   DERROTAR MURCIÉLAGO
   ========================================================= */

function defeatAct4Bat(
    bat
){

    if(!bat.alive)
        return;


    bat.alive =
        false;


    ACT4.batsDefeated++;


    bat.element.classList.add(
        "batDefeated"
    );


    setTimeout(() => {

        bat.element.style.display =
            "none";

    },400);

}


/* =========================================================
   PLATAFORMAS MÓVILES
   ========================================================= */

function updateAct4Platforms(){

    const platforms =
        document.querySelectorAll(
            ".vampireMovingPlatform"
        );


    const time =
        performance.now() / 1000;


    platforms.forEach(
        (platform,index) => {

            const movement =
                Math.sin(
                    time +
                    index * 1.7
                )
                * 75;


            platform.style.transform =
                `translateY(${movement}px)`;

        }
    );

}


/* =========================================================
   DESPERTAR AL VAMPIRO
   ========================================================= */

function checkAct4BossTrigger(){

    if(
        ACT4.bossStarted ||
        playerX < 3500
    ){
        return;
    }


    ACT4.bossStarted =
        true;


    const arena =
        document.getElementById(
            "vampireArena"
        );


    arena.classList.add(
        "locked"
    );


    showDialogue(

    );


    setTimeout(() => {

        showDialogue(
            "Nahara."
        );

    },1800);


    setTimeout(() => {

        showDialogue(
            "El ataúd se está abriendo."
        );

    },3500);


    setTimeout(() => {

        ACT4.boss.element
            .classList.add(
                "awake"
            );


        document
            .getElementById(
                "bossHealth"
            )
            .classList.add(
                "show"
            );

    },5000);

}


/* =========================================================
   MOVIMIENTO DEL BOSS
   ========================================================= */

function updateAct4Boss(){

    if(
        !ACT4.bossStarted ||
        !ACT4.boss.alive
    ){
        return;
    }


    const boss =
        ACT4.boss;


    const distance =
        playerX - boss.x;


    /* MOVIMIENTO LENTO */

    if(
        Math.abs(distance) > 250
    ){

        boss.x +=
            Math.sign(distance)
            * .8;

    }


    boss.element.style.left =
        boss.x + "px";


    boss.attackTimer++;


    /* ATAQUE CADA CIERTO TIEMPO */

    if(
        boss.attackTimer > 150
    ){

        boss.attackTimer = 0;

        act4BossAttack();

    }


    /* CONTACTO */

    const touching =

        playerX +
        PLAYER_WIDTH
            > boss.x

        &&

        playerX
            < boss.x + 130

        &&

        playerBottom +
        PLAYER_HEIGHT
            > boss.bottom

        &&

        playerBottom
            < boss.bottom + 190;


    if(
        touching &&
        !ACT2.invulnerable
    ){

        damageNaharaAct2();

    }

}


/* =========================================================
   ATAQUE DEL VAMPIRO
   ========================================================= */

function act4BossAttack(){

    const boss =
        ACT4.boss;


    const orb =
        document.createElement(
            "div"
        );


    orb.className =
        "vampireOrb";


    const direction =
        playerX < boss.x
        ? -1
        : 1;


    const orbX =
        boss.x + 55;


    const orbBottom =
        boss.bottom + 120;


    orb.style.left =
        orbX + "px";


    orb.style.bottom =
        orbBottom + "px";


    document
        .getElementById(
            "act4Scene"
        )
        .appendChild(
            orb
        );


    boss.projectiles.push({

        element:orb,

        x:orbX,

        bottom:orbBottom,

        velocityX:
            direction * 5.5

    });

}


/* =========================================================
   ACTUALIZAR ATAQUES DEL BOSS
   ========================================================= */

function updateAct4BossProjectiles(){

    const shots =
        ACT4.boss.projectiles;


    for(
        let i =
            shots.length - 1;

        i >= 0;

        i--
    ){

        const shot =
            shots[i];


        shot.x +=
            shot.velocityX;


        shot.element.style.left =
            shot.x + "px";


        const touching =

            playerX +
            PLAYER_WIDTH
                > shot.x

            &&

            playerX
                < shot.x + 35

            &&

            playerBottom +
            PLAYER_HEIGHT
                > shot.bottom

            &&

            playerBottom
                < shot.bottom + 35;


        if(touching){

            damageNaharaAct2();


            shot.element.remove();


            shots.splice(
                i,
                1
            );


            continue;

        }


        if(
            shot.x < 3300 ||
            shot.x > 4400
        ){

            shot.element.remove();


            shots.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   DAÑO AL BOSS
   ========================================================= */

function damageAct4Boss(){

    const boss =
        ACT4.boss;


    if(!boss.alive)
        return;


    boss.hp--;


    boss.element.classList.add(
        "bossHit"
    );


    setTimeout(() => {

        boss.element.classList.remove(
            "bossHit"
        );

    },150);


    updateAct4BossHealth();


    if(boss.hp <= 0){

        defeatAct4Boss();

    }

}


/* =========================================================
   BARRA DE VIDA
   ========================================================= */

function updateAct4BossHealth(){

    const bar =
        document.getElementById(
            "bossHealthFill"
        );


    const percentage =

        (
            ACT4.boss.hp /
            ACT4.boss.maxHp
        )
        * 100;


    bar.style.width =
        percentage + "%";

}


/* =========================================================
   DERROTAR BOSS
   ========================================================= */

function defeatAct4Boss(){

    const boss =
        ACT4.boss;


    boss.alive =
        false;


    ACT4.bossDefeated =
        true;


    boss.element.classList.add(

    );

.vampireBat{

    position:absolute;

    width:65px;
    height:35px;

    z-index:45;

    background:#0b080c;

    border-radius:50%;

    animation:
        batFloat
        .7s ease-in-out
        infinite alternate;
}


.vampireBat::before,
.vampireBat::after{

    content:"";

    position:absolute;

    width:45px;
    height:35px;

    top:3px;

    background:#181019;

    clip-path:
        polygon(
            0 0,
            100% 30%,
            70% 100%,
            45% 60%,
            20% 100%
        );
}


.vampireBat::before{

    left:-35px;

    transform:scaleX(-1);
}


.vampireBat::after{

    right:-35px;
}


.vampireBat .batEyes{

    position:absolute;

    width:7px;
    height:7px;

    left:20px;
    top:10px;

    border-radius:50%;

    background:#d0919d;

    box-shadow:
        19px 0 #d0919d;

    z-index:5;
}


@keyframes batFloat{

    from{
        transform:translateY(-7px);
    }

    to{
        transform:translateY(8px);
    }
}


.batDefeated{

    animation:
        batDeath
        .4s forwards !important;
}


@keyframes batDeath{

    to{

        opacity:0;

        transform:
            translateY(100px)
            rotate(180deg);

    }
}

.vampireCape{

    background:#110a0e;

        polygon(
            0 0,
            100% 0,
            90% 75%,
            65% 40%,
            50% 100%,
            35% 40%,
            10% 75%
        );
}


.vampireEyes{

    position:absolute;

    width:8px;
    height:12px;

    left:15px;
    top:38px;

        );
}


.bossDefeated{

    animation:
        vampireDeath
        1.5s forwards;
}


@keyframes vampireDeath{

    0%{
        opacity:1;
    }

    40%{

        transform:
            translateY(-40px)
            scale(1.2);

    }

    100%{

        opacity:0;

        transform:

}

   ACTO V — THE TOY ROOM
   ========================================================= */

const ACT5 = {

    active:false,
    completed:false,

    musicStarted:false,
    firstDollEvent:false,
    secondDollEvent:false,

    loopTriggered:false,
    womanTriggered:false,

    finalDoorUnlocked:false,

    dollStage:0
};


/* =========================================================
   INICIAR ACTO V
   ========================================================= */

function startAct5(){

    ACT5.active = true;
    ACT5.completed = false;

    ACT5.musicStarted = false;
    ACT5.firstDollEvent = false;
    ACT5.secondDollEvent = false;

    ACT5.loopTriggered = false;
    ACT5.womanTriggered = false;

    ACT5.finalDoorUnlocked = false;

    ACT5.dollStage = 0;


    document
        .getElementById("act5Scene")
        .classList.add("active");


    playerX = 180;
    playerBottom = GROUND_Y;
    velocityY = 0;


    setTimeout(() => {

        showDialogue(
            "..."
        );

    },900);


    setTimeout(() => {

        showDialogue(
            "No me gustan las muñecas."
        );

    },2400);


    setTimeout(() => {

        showDialogue(
            "Especialmente cuando parecen estar mirándonos."
        );

    },5000);

}


/* =========================================================
   CAJA MUSICAL
   ========================================================= */

function triggerAct5MusicBox(){

    if(ACT5.musicStarted)
        return;


    ACT5.musicStarted = true;


    const box =
        document.getElementById(
            "toyMusicBox"
        );


    box.classList.add(
        "playing"
    );


    /*
       Cuando añadamos AUDIO:

       musicBoxAudio.play();
    */


    setTimeout(() => {

        showDialogue(
            "Nahara..."
        );

    },1000);


    setTimeout(() => {

        showDialogue(
            "Dime que tú encendiste eso."
        );

    },3000);

}


/* =========================================================
   MUÑECAS
   ========================================================= */

function moveAct5Dolls(){

    const doll1 =
        document.getElementById(
            "creepyDoll1"
        );


    const doll2 =
        document.getElementById(
            "creepyDoll2"
        );


    const doll3 =
        document.getElementById(
            "creepyDoll3"
        );


    ACT5.dollStage++;


    if(ACT5.dollStage === 1){

        doll1.classList.add(
            "closer1"
        );

    }


    if(ACT5.dollStage === 2){

        doll1.classList.add(
            "closer2"
        );


        doll2.classList.add(
            "closer1"
        );

    }


    if(ACT5.dollStage === 3){

        doll1.classList.add(
            "closer3"
        );


        doll2.classList.add(
            "closer2"
        );


        doll3.classList.add(
            "closer1"
        );

    }

}


/* =========================================================
   PRIMER EVENTO DE MUÑECA
   ========================================================= */

function triggerAct5FirstDoll(){

    if(ACT5.firstDollEvent)
        return;


    ACT5.firstDollEvent = true;


    const blink =
        document.getElementById(
            "toyBlink"
        );


    blink.classList.add(
        "active"
    );


    setTimeout(() => {

        moveAct5Dolls();

    },200);


    setTimeout(() => {

        blink.classList.remove(
            "active"
        );

    },450);


    setTimeout(() => {

        showDialogue(
            "..."
        );

    },900);


    setTimeout(() => {

        showDialogue(
            "Esa muñeca estaba más lejos."
        );

    },2400);

}


/* =========================================================
   SEGUNDO EVENTO
   ========================================================= */

function triggerAct5SecondDoll(){

    if(ACT5.secondDollEvent)
        return;


    ACT5.secondDollEvent = true;


    const blink =
        document.getElementById(
            "toyBlink"
        );


    blink.classList.add(
        "active"
    );


    setTimeout(() => {

        moveAct5Dolls();

    },180);


    setTimeout(() => {

        blink.classList.remove(
            "active"
        );

    },420);


    setTimeout(() => {

        showDialogue(
            "No voltees."
        );

    },800);


    setTimeout(() => {

        showDialogue(
            "En realidad... sí. Voltea."
        );

    },3000);


    setTimeout(() => {

        showDialogue(
            "No. Mala idea. Sigue caminando."
        );

    },5200);

}


/* =========================================================
   PASILLO IMPOSIBLE
   ========================================================= */

function triggerAct5Loop(){

    if(ACT5.loopTriggered)
        return;


    ACT5.loopTriggered = true;


    const transition =
        document.getElementById(
            "toyLoopTransition"
        );


    transition.classList.add(
        "active"
    );


    setTimeout(() => {

        /*
           Nahara parece regresar
           al mismo pasillo.
        */

        playerX = 2050;


        transition.classList.remove(
            "active"
        );

    },850);


    setTimeout(() => {

        showDialogue(
            "..."
        );

    },1300);


    setTimeout(() => {

        showDialogue(
            "¿No acabamos de pasar por aquí?"
        );

    },2800);


    setTimeout(() => {

        moveAct5Dolls();

    },4700);

}


/* =========================================================
   MUJER ESPECTRAL
   ========================================================= */

function triggerAct5Woman(){

    if(ACT5.womanTriggered)
        return;


    ACT5.womanTriggered = true;


    const woman =
        document.getElementById(
            "spectralWoman"
        );


    const darkness =
        document.getElementById(
            "womanDarkness"
        );


    /* OSCURECER */

    darkness.classList.add(
        "active"
    );


    setTimeout(() => {

        woman.classList.add(
            "appear"
        );

    },500);


    /*
       Aparece muy poco tiempo.
       NO repetir.
    */


    setTimeout(() => {

        woman.classList.remove(
            "appear"
        );


        darkness.classList.remove(
            "active"
        );

    },1450);


    setTimeout(() => {

        showDialogue(
            "..."
        );

    },1900);


    setTimeout(() => {

        showDialogue(
            "Corre."
        );

    },3200);


    ACT5.finalDoorUnlocked =
        true;

}


/* =========================================================
   EVENTOS SEGÚN POSICIÓN
   ========================================================= */

function updateAct5Events(){

    if(
        playerX > 650 &&
        !ACT5.musicStarted
    ){

        triggerAct5MusicBox();

    }


    if(
        playerX > 1200 &&
        !ACT5.firstDollEvent
    ){

        triggerAct5FirstDoll();

    }


    if(
        playerX > 2100 &&
        !ACT5.secondDollEvent
    ){

        triggerAct5SecondDoll();

    }


    if(
        playerX > 2950 &&
        !ACT5.loopTriggered
    ){

        triggerAct5Loop();

    }


    /*
       Después del loop,
       debe volver a avanzar
       hasta esta posición.
    */

    if(
        ACT5.loopTriggered &&
        playerX > 3450 &&
        !ACT5.womanTriggered
    ){

        triggerAct5Woman();

    }

}


/* =========================================================
   OJOS DE LAS MUÑECAS
   ========================================================= */

function updateAct5DollEyes(){

    const dolls =
        document.querySelectorAll(
            ".creepyDoll"
        );


    dolls.forEach(doll => {

        const eyes =
            doll.querySelector(
                ".dollEyes"
            );


        if(!eyes)
            return;


        const dollX =
            parseFloat(
                getComputedStyle(doll).left
            );


        if(playerX < dollX){

            eyes.style.transform =
                "translateX(-2px)";

        }else{

            eyes.style.transform =
                "translateX(2px)";

        }

    });

}


/* =========================================================
   PUERTA FINAL
   ========================================================= */

function checkAct5Exit(){

    if(playerX < 4100)
        return;


    if(!ACT5.finalDoorUnlocked){

        playerX = 4070;


        showDialogue(
            "No abre."
        );


        return;

    }


    finishAct5();

}


/* =========================================================
   TERMINAR ACTO V
   ========================================================= */

function finishAct5(){

    if(ACT5.completed)
        return;


    ACT5.completed = true;

    ACT5.active = false;


    const clock =
        document.getElementById(
            "toyFinalClock"
        );


    clock.classList.add(
        "awake"
    );


    showDialogue(
        "Espera."
    );


    setTimeout(() => {

        showDialogue(
            "¿Ese reloj estaba ahí antes?"
        );

    },2600);


    setTimeout(() => {

        document
            .getElementById(
                "act5Fade"
            )
            .classList.add(
                "active"
            );

    },5200);


    /*
       DESPUÉS:

       transitionToAct6();

       ACTO VI —
       MIDNIGHT
    */

}


/* =========================================================
   LOOP DEL ACTO V
   ========================================================= */

function updateAct5(){

    if(
        !ACT5.active ||
        ACT5.completed
    ){
        return;
    }


    updateAct5Events();

    updateAct5DollEyes();

    checkAct5Exit();

}

   ========================================================= */

#spectralWoman{

    position:fixed;

    left:50%;
    bottom:0;

    width:190px;
    height:520px;

    transform:
        translateX(-50%)
        scale(.75);

    z-index:885;

    opacity:0;

    pointer-events:none;
}


/* VESTIDO */

.womanDress{

    position:absolute;

    width:190px;
    height:390px;

    bottom:0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(200,195,185,.75),
            rgba(235,225,210,.85),
            rgba(200,195,185,.7),
            transparent
        );

    clip-path:
        polygon(
            38% 0,
            62% 0,
            100% 100%,
            0 100%
        );
}


/* CABEZA */

.womanHead{

    position:absolute;

    width:95px;
    height:115px;

    left:47px;
    top:30px;

    background:#c6beb4;

    border-radius:48%;
}


/* PELO */

.womanHair{

    position:absolute;

    width:135px;
    height:200px;

    left:-20px;
    top:-20px;

    background:#161113;

    border-radius:
        50% 50% 35% 35%;
}


/* CARA */

.womanFace{

    position:absolute;

    width:65px;
    height:80px;

    left:15px;
    top:30px;

    background:#c6beb4;

    border-radius:45%;

    z-index:2;
}


/* OJOS */

.womanFace::before{

    content:"";

    position:absolute;

    width:13px;
    height:23px;

    left:10px;
    top:27px;

    border-radius:50%;

    background:#080607;

    box-shadow:
        31px 0 #080607;
}


/* BOCA */

.womanFace::after{

    content:"";

    position:absolute;

    width:20px;
    height:7px;

    left:22px;
    top:61px;

    background:#4d2831;

    border-radius:50%;
}


#spectralWoman.appear{

    animation:
        spectralAppear
        .95s forwards;
}


@keyframes spectralAppear{

    0%{

        opacity:0;

        transform:
            translateX(-50%)
            scale(.65);

    }

    20%{

        opacity:.25;

    }

    50%{

        opacity:1;

        transform:
            translateX(-50%)
            scale(1);

    }

    82%{

        opacity:1;

        transform:
            translateX(-50%)
            scale(1.08);

    }

    100%{

        opacity:0;

        transform:
            translateX(-50%)
            scale(1.3);

    }

}


/* =========================================================
   RELOJ FINAL
   ========================================================= */

#toyFinalClock{

    position:absolute;

    left:4120px;
    bottom:330px;

    width:150px;
    height:150px;

    border-radius:50%;

    background:#d1c1aa;

    border:
        12px solid #1a0e14;

    box-shadow:
        0 0 0 6px #5c3744;

    opacity:.25;
}


#toyFinalClock::before{

    content:"";

    position:absolute;

    width:6px;
    height:48px;

    left:60px;
    top:25px;

    background:#160c10;

    transform-origin:
        bottom center;

    transform:
        rotate(0deg);
}


#toyFinalClock::after{

    content:"11:57";

    position:absolute;

    width:100%;

    bottom:-45px;

    text-align:center;

    color:#c9a6aa;

    letter-spacing:5px;

    font-size:18px;
}


#toyFinalClock.awake{

    opacity:1;

    animation:
        clockAwake
        .8s alternate infinite;
}


@keyframes clockAwake{

    from{

        filter:
            drop-shadow(
                0 0 0
                transparent
            );

    }

    to{

        filter:
            drop-shadow(
                0 0 15px
                rgba(173,94,113,.6)
            );

    }

}


/* =========================================================
   FADE FINAL
   ========================================================= */

#act5Fade{

    position:fixed;

    inset:0;

    z-index:950;

    background:#000;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 2s;
}


#act5Fade.active{
    opacity:1;
}

const ACT6 = {

    active:false,
    completed:false,

    minute:57,

    stage57:false,
    stage58:false,
    stage59:false,
    midnight:false,

    ghostMissing:false,

    memory1:false,
    memory2:false,
    memory3:false,

    finalDoorUnlocked:false

/* =========================================================
   INICIAR ACTO VI
   ========================================================= */

function startAct6(){

    ACT6.active = true;
    ACT6.completed = false;

    ACT6.minute = 57;

    document
        .getElementById("act6Scene")
        .classList.add("active");


    document
        .getElementById("act6Fade")
        .classList.remove("active");


    playerX = 180;
    playerBottom = GROUND_Y;
    velocityY = 0;


    updateAct6Clock();


    setTimeout(() => {

        showDialogue(
            "11:57."
        );

    },900);


    setTimeout(() => {

        showDialogue(
            "Tenemos tres minutos."
        );

    },2800);


    setTimeout(() => {

        showDialogue(
            "No preguntes para qué."
        );

    },5000);

}


/* =========================================================
   RELOJ
   ========================================================= */

function updateAct6Clock(){

    const clock =
        document.getElementById(
            "midnightClockText"
        );


    if(clock){

        clock.textContent =
            "11:" +
            String(ACT6.minute)
                .padStart(2,"0");

    }

}

/* =========================================================
   ??? DESAPARECE
   ========================================================= */

function hideAct6Ghost(){

    if(ACT6.ghostMissing)
        return;


    ACT6.ghostMissing = true;


    const ghost =
        document.getElementById(
            "ghost"
        );


    if(ghost){

        ghost.classList.add(
            "ghostMissing"
        );

    }

}


/* =========================================================
   ??? REGRESA
   ========================================================= */

function returnAct6Ghost(){

    if(ACT6.ghostReturned)
        return;


    ACT6.ghostReturned = true;


    const ghost =
        document.getElementById(
            "ghost"
        );


    if(ghost){

        ghost.classList.remove(
            "ghostMissing"
        );


        ghost.classList.add(
            "ghostReturn"
        );

    }


    setTimeout(() => {

        showDialogue(
            "Estoy aquí."
        );

    },600);


    setTimeout(() => {

        showDialogue(
            "Solo necesitaba asegurarme de algo."
        );

    },2800);


    setTimeout(() => {

        showDialogue(
            "Ya podemos irnos."
        );

    },5100);


    ACT6.finalDoorUnlocked = true;

}


/* =========================================================
   EVENTOS SEGÚN POSICIÓN
   ========================================================= */

function updateAct6Events(){

    /*
       11:57
    */

    if(
        playerX > 600 &&
        !ACT6.stage57
    ){

        ACT6.stage57 = true;

        triggerAct6Memory1();

    }


    /*
       11:58
    */

    if(
        playerX > 1250 &&
        !ACT6.stage58
    ){

        triggerAct6_1158();

    }


    if(
        playerX > 1750 &&
        !ACT6.memory2
    ){

        triggerAct6Memory2();

    }


    /*
       11:59
    */

    if(
        playerX > 2350 &&
        !ACT6.stage59
    ){

        triggerAct6_1159();

    }


    if(
        playerX > 2850 &&
        !ACT6.memory3
    ){

        triggerAct6Memory3();

    }


    /*
       12:00
    */

    if(
        playerX > 3450 &&
        !ACT6.midnight
    ){

        triggerAct6Midnight();

    }

}


/* =========================================================
   PUERTA FINAL
   ========================================================= */

function checkAct6FinalDoor(){

    if(playerX < 4100)
        return;


    if(!ACT6.finalDoorUnlocked){

        playerX = 4060;

        return;

    }


    finishAct6();

}


/* =========================================================
   FINAL ACTO VI
   ========================================================= */

function finishAct6(){

    if(ACT6.completed)
        return;


    ACT6.completed = true;

    ACT6.active = false;


    showDialogue(
        "Nahara."
    );


    setTimeout(() => {

        showDialogue(
            "Antes de abrir esa puerta..."
        );

    },2300);


    setTimeout(() => {

        showDialogue(
            "hay algo que tengo que enseñarte."
        );

    },4700);


    setTimeout(() => {

        document
            .getElementById(
                "act6FinalFade"
            )
            .classList.add(
                "active"
            );

    },7000);


    /*
       SIGUIENTE:

       startFinalAct();

       FINAL —
       NAHARA'S BIRTHDAY
    */

}


/* =========================================================
   LOOP ACTO VI
   ========================================================= */

function updateAct6(){

    if(
        !ACT6.active ||
        ACT6.completed
    ){
        return;
    }


    updateAct6Events();

    checkAct6FinalDoor();

}

   ========================================================= */

const FINAL_ACT = {

    active:false,
    completed:false,

    doorOpened:false,
    lightsOn:false,
    catsEntered:false,

    revealStarted:false,
    ghostRevealed:false,

    endingStarted:false
};


/* =========================================================
   INICIAR FINAL
   ========================================================= */

function startFinalAct(){

    FINAL_ACT.active = true;


    document
        .getElementById("finalScene")
        .classList.add("active");


    /*
       Quitamos HUD de combate.
    */

    const hud =
        document.getElementById("hud");

    if(hud){

        hud.classList.add(
            "finalHidden"
        );

    }


    const objective =
        document.getElementById(
            "objective"
        );

    if(objective){

        objective.style.opacity =
            "0";

    }


    /*
       Ocultar reloj del acto VI.
    */

    const midnightClock =
        document.getElementById(
            "midnightClock"
        );

    if(midnightClock){

        midnightClock.style.display =
            "none";

    }


    playerX = 250;

    playerBottom =
        GROUND_Y;

    velocityY = 0;


    /*
       Empezamos completamente
       a oscuras.
    */

    setTimeout(() => {

        document
            .getElementById(
                "finalFade"
            )
            .classList.remove(
                "active"
            );

    },700);


    setTimeout(() => {

        showDialogue(
            "..."
        );

    },1700);


    setTimeout(() => {

        showDialogue(
            "Adelante."
        );

    },3400);

}


/* =========================================================
   ABRIR PUERTA
   ========================================================= */

function triggerFinalDoor(){

    if(FINAL_ACT.doorOpened)
        return;


    FINAL_ACT.doorOpened =
        true;


    const door =
        document.getElementById(
            "birthdayDoor"
        );


    door.classList.add(
        "open"
    );


    setTimeout(() => {

        turnFinalLightsOn();

    },900);

}


/* =========================================================
   ENCENDER HABITACIÓN
   ========================================================= */

function turnFinalLightsOn(){

    if(FINAL_ACT.lightsOn)
        return;


    FINAL_ACT.lightsOn =
        true;


    document
        .getElementById(
            "finalScene"
        )
        .classList.add(
            "lightsOn"
        );


    const lightFlash =
        document.getElementById(
            "birthdayLightFlash"
        );


    lightFlash.classList.add(
        "active"
    );


    setTimeout(() => {

        lightFlash.classList.remove(
            "active"
        );

    },1000);


    /*
       Aparecen las decoraciones.
    */

    document
        .querySelectorAll(
            ".birthdayDecoration"
        )
        .forEach(
            decoration => {

                decoration.classList.add(
                    "visible"
                );

            }
        );


    setTimeout(() => {

        showDialogue(
            "Sorpresa."
        );

    },1000);


    setTimeout(() => {

        bringFinalCats();

    },2700);

}


/* =========================================================
   REGRESAN LOS GATOS
   ========================================================= */

function bringFinalCats(){

    if(FINAL_ACT.catsEntered)
        return;


    FINAL_ACT.catsEntered =
        true;


    const cats =
        document.querySelectorAll(
            ".finalCat"
        );


    cats.forEach(
        (cat,index) => {

            setTimeout(() => {

                cat.classList.add(
                    "enter"
                );

            },index * 320);

        }
    );


    setTimeout(() => {

        showDialogue(
            "Mira quiénes llegaron."
        );

    },1900);


    setTimeout(() => {

        showDialogue(
            "Sabía que encontrarlos serviría para algo."
        );

    },4200);

}


/* =========================================================
   ACTIVAR REVELACIÓN
   ========================================================= */

function triggerFinalReveal(){

    if(FINAL_ACT.revealStarted)
        return;


    FINAL_ACT.revealStarted =
        true;


    /*
       Nahara deja de poder avanzar.
    */

    keys.left = false;
    keys.right = false;


    const ghost =
        document.getElementById(
            "ghost"
        );


    if(ghost){

        ghost.classList.add(
            "finalGhostPosition"
        );

    }


    showDialogue(
        "Nahara."
    );


    setTimeout(() => {

        showDialogue(
            "Hay una última cosa."
        );

    },2300);


    setTimeout(() => {

        showDialogue(
            "Todo este tiempo me llamaste ???."
        );

    },4700);


    setTimeout(() => {

        showDialogue(
            "Supongo que ya no necesito esconderme."
        );

    },7200);


    setTimeout(() => {

        revealFinalGhost();

    },9400);

}


/* =========================================================
   REVELACIÓN DE ???
   ========================================================= */

function revealFinalGhost(){

    if(FINAL_ACT.ghostRevealed)
        return;


    FINAL_ACT.ghostRevealed =
        true;


    const darkness =
        document.getElementById(
            "ghostRevealDarkness"
        );


    darkness.classList.add(
        "active"
    );


    setTimeout(() => {

        document
            .getElementById(
                "finalGhostReveal"
            )
            .classList.add(
                "visible"
            );

    },1000);


    setTimeout(() => {

        showDialogue(
            "Soy yo."
        );

    },2500);


    setTimeout(() => {

        showDialogue(
            "El mismo que estuvo contigo desde el bosque."
        );

    },4900);


    setTimeout(() => {

        showDialogue(
            "Solo que..."
        );

    },7200);


    setTimeout(() => {

        showDialogue(
            "no pertenezco únicamente a este lugar."
        );

    },8900);


    setTimeout(() => {

        showDialogue(
            "También existo fuera de aquí."
        );

    },11100);


    /*
       Aquí empezamos la transición
       juego -> regalo real.
    */

    setTimeout(() => {

        triggerRealWorldReveal();

    },13700);

}


/* =========================================================
   TRANSICIÓN AL FANTASMITA REAL
   ========================================================= */

function triggerRealWorldReveal(){

    const ghostReveal =
        document.getElementById(
            "finalGhostReveal"
        );


    ghostReveal.classList.add(
        "realWorld"
    );


    const crochetHint =
        document.getElementById(
            "crochetHint"
        );


    crochetHint.classList.add(
        "visible"
    );


    setTimeout(() => {

        showDialogue(
            "Creo que ahora deberías buscarme."
        );

    },1200);


    setTimeout(() => {

        showDialogue(
            "Fuera de la pantalla."
        );

    },3900);


    setTimeout(() => {

        showDialogue(
            "Estoy más cerca de lo que crees."
        );

    },6500);


    setTimeout(() => {

        startFinalBirthdayMoment();

    },9400);

}


/* =========================================================
   MOMENTO DE CUMPLEAÑOS
   ========================================================= */

function startFinalBirthdayMoment(){

    const darkness =
        document.getElementById(
            "ghostRevealDarkness"
        );


    darkness.classList.remove(
        "active"
    );


    document
        .getElementById(
            "birthdayTitle"
        )
        .classList.add(
            "visible"
        );


    document
        .getElementById(
            "birthdayCake"
        )
        .classList.add(
            "visible"
        );


    document
        .querySelectorAll(
            ".birthdayStar"
        )
        .forEach(
            (star,index) => {

                setTimeout(() => {

                    star.classList.add(
                        "visible"
                    );

                },index * 130);

            }
        );


    setTimeout(() => {

        showDialogue(
            "Feliz cumpleaños, Nahara."
        );

    },1500);


    setTimeout(() => {

        finishFinalAct();

    },6000);

}


/* =========================================================
   CIERRE
   ========================================================= */

function finishFinalAct(){

    if(FINAL_ACT.endingStarted)
        return;


    FINAL_ACT.endingStarted =
        true;


    const ending =
        document.getElementById(
            "finalEnding"
        );


    ending.classList.add(
        "visible"
    );


    setTimeout(() => {

        document
            .getElementById(
                "finalEndingTitle"
            )
            .classList.add(
                "visible"
            );

    },1800);


    setTimeout(() => {

        document
            .getElementById(
                "finalEndingGhost"
            )
            .classList.add(
                "visible"
            );

    },3500);


    FINAL_ACT.completed =
        true;

}


/* =========================================================
   EVENTOS POR POSICIÓN
   ========================================================= */

function updateFinalEvents(){

    /*
       Entrada.
    */

    if(
        playerX > 550 &&
        !FINAL_ACT.doorOpened
    ){

        triggerFinalDoor();

    }


    /*
       Revelación.
    */

    if(
        playerX > 1700 &&
        FINAL_ACT.lightsOn &&
        !FINAL_ACT.revealStarted
    ){

        triggerFinalReveal();

    }

}


/* =========================================================
   LOOP FINAL
   ========================================================= */

function updateFinalAct(){

    if(
        !FINAL_ACT.active ||
        FINAL_ACT.completed
    ){
        return;
    }


    updateFinalEvents();

}

            #311924,
            #080407 70%
        );

    opacity:0;

    pointer-events:none;

    transition:2.5s;
}


#finalEnding.visible{

    opacity:1;
}


#finalEndingTitle{

    position:absolute;

    width:100%;

    top:35%;

    text-align:center;

    color:#dfb4c0;

    font-size:
        clamp(
            32px,
            6vw,
            80px
        );

    letter-spacing:9px;

    opacity:0;

    transform:
        translateY(20px);

    transition:2s;
}


#finalEndingTitle.visible{

    opacity:1;

    transform:
        translateY(0);
}


#finalEndingGhost{

    position:absolute;

    width:70px;
    height:70px;

    left:50%;
    top:57%;

    transform:
        translateX(-50%)
        scale(.5);

    opacity:0;

    transition:2s;
}


#finalEndingGhost.visible{

    opacity:.8;

    transform:
        translateX(-50%)
        scale(1);
}

   ========================================================= */

#finalFade{

    position:fixed;

    inset:0;

    z-index:970;

    background:#000;

    opacity:0;

    pointer-events:none;

    transition:2s;
}


#finalFade.active{

    opacity:1;
}


/* HUD */

#hud.finalHidden{

    opacity:0;

    pointer-events:none;
}
