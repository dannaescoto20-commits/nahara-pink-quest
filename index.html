<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>La Mansión de Nahara</title>

<style>

/* ============================= */
/* BASE DEL JUEGO */
/* ============================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050407;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    color: #eadfd5;
}


/* ============================= */
/* PANTALLA DEL JUEGO */
/* ============================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 20%,
            #24202a 0%,
            #111017 40%,
            #050407 75%
        );

}


/* ============================= */
/* LLUVIA */
/* ============================= */

.rain {

    position: absolute;

    width: 100%;
    height: 100%;

    pointer-events: none;

    opacity: .28;

    background-image:

        repeating-linear-gradient(
            110deg,
            transparent 0px,
            transparent 18px,
            rgba(200,220,230,.4) 19px,
            transparent 20px,
            transparent 40px
        );

    animation: rainMove .35s linear infinite;

}

@keyframes rainMove {

    from {
        transform: translateY(-30px);
    }

    to {
        transform: translateY(30px);
    }

}


/* ============================= */
/* LUNA */
/* ============================= */

.moon {

    position: absolute;

    width: 150px;
    height: 150px;

    left: 12%;
    top: 10%;

    border-radius: 50%;

    background: #d9d9d4;

    box-shadow:
        0 0 30px rgba(220,220,220,.25),
        0 0 90px rgba(190,200,220,.15);

}


/* ============================= */
/* MONTAÑAS / BOSQUE */
/* ============================= */

.mountain {

    position: absolute;

    bottom: 0;

    width: 100%;
    height: 48%;

    background:

        linear-gradient(
            145deg,
            transparent 40%,
            #08080c 41%
        ),

        linear-gradient(
            215deg,
            transparent 45%,
            #0b090e 46%
        );

}


/* ============================= */
/* MANSIÓN */
/* ============================= */

.mansion {

    position: absolute;

    width: 520px;
    height: 340px;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    background: #0b0a0e;

    border: 2px solid #17131a;

    box-shadow:
        0 0 80px rgba(0,0,0,.9);

}


/* TECHO */

.mansion::before {

    content: "";

    position: absolute;

    width: 420px;
    height: 210px;

    left: 50%;
    top: -145px;

    transform:
        translateX(-50%)
        rotate(45deg);

    background: #09090d;

    z-index: -1;

}


/* ============================= */
/* TORRES */
/* ============================= */

.tower {

    position: absolute;

    width: 110px;
    height: 420px;

    bottom: 0;

    background: #09090d;

}

.tower.left {
    left: -90px;
}

.tower.right {
    right: -90px;
}


/* ============================= */
/* VENTANAS */
/* ============================= */

.window {

    position: absolute;

    width: 45px;
    height: 75px;

    background: #17141a;

    border:

        4px solid #08070a;

    border-radius:

        30px 30px 0 0;

    overflow: hidden;

}


/* POSICIONES */

.window.w1 {
    left: 70px;
    top: 80px;
}

.window.w2 {
    left: 180px;
    top: 65px;
}

.window.w3 {
    right: 180px;
    top: 65px;
}

.window.w4 {
    right: 70px;
    top: 80px;
}


/* VENTANA ENCENDIDA */

.window.light {

    background:

        radial-gradient(
            circle,
            #b87657,
            #55251e 60%,
            #1a0d0d
        );

    box-shadow:

        0 0 25px
        rgba(180,90,60,.3);

}


/* ============================= */
/* FIGURA EN LA VENTANA */
/* ============================= */

.figure {

    position: absolute;

    width: 17px;
    height: 45px;

    bottom: 0;
    left: 14px;

    background: #050506;

    border-radius:

        50% 50% 20% 20%;

    opacity: 0;

}

.figure.show {

    opacity: 1;

}


/* ============================= */
/* PUERTA */
/* ============================= */

.door {

    position: absolute;

    width: 80px;
    height: 135px;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    background:

        linear-gradient(
            90deg,
            #120b0d,
            #261116,
            #120b0d
        );

    border:

        4px solid #080608;

}


/* ============================= */
/* TÍTULO */
/* ============================= */

.title {

    position: absolute;

    width: 100%;

    top: 12%;

    text-align: center;

    z-index: 10;

    text-shadow:

        0 5px 20px #000;

}


.title-small {

    font-size: 22px;

    letter-spacing: 8px;

}


.title-main {

    font-size: 72px;

    letter-spacing: 5px;

    margin-top: 5px;

}


.title-name {

    font-size: 30px;

    letter-spacing: 8px;

    color: #c79aa4;

}


.subtitle {

    margin-top: 16px;

    font-size: 15px;

    letter-spacing: 4px;

    color: #9e858b;

}


/* ============================= */
/* BOTÓN ENTRAR */
/* ============================= */

.enter {

    position: absolute;

    left: 50%;
    bottom: 17%;

    transform: translateX(-50%);

    padding:

        16px 65px;

    color: #e7d7ce;

    background:

        rgba(15,8,11,.9);

    border:

        1px solid #75434f;

    font-family: Georgia;

    letter-spacing: 4px;

    cursor: pointer;

    transition: .25s;

    z-index: 20;

}


.enter:hover {

    background: #35121c;

    border-color: #b47482;

    box-shadow:

        0 0 25px
        rgba(150,70,90,.25);

}


/* ============================= */
/* RELÁMPAGO */
/* ============================= */

#lightning {

    position: absolute;

    width: 100%;
    height: 100%;

    background: #dce4eb;

    opacity: 0;

    pointer-events: none;

    z-index: 50;

}


.flash {

    animation:

        lightningFlash .5s;

}


@keyframes lightningFlash {

    0% {
        opacity: 0;
    }

    10% {
        opacity: .7;
    }

    20% {
        opacity: .1;
    }

    30% {
        opacity: .4;
    }

    100% {
        opacity: 0;
    }

}

/* ============================= */
/* INTRO CINEMÁTICA */
/* ============================= */

#introScene {

    position: absolute;

    inset: 0;

    background: #050407;

    display: none;

    z-index: 100;

    overflow: hidden;

}


#introScene.active {

    display: block;

}


/* TEXTO DE LA INTRO */

.introText {

    position: absolute;

    width: 100%;

    top: 50%;

    transform: translateY(-50%);

    text-align: center;

    font-size: 34px;

    letter-spacing: 7px;

    color: #d8c9c0;

    opacity: 0;

    transition: opacity 1s;

}


.introText.show {

    opacity: 1;

}


/* PASILLO OSCURO */

.introHall {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.8)
        ),

        radial-gradient(
            circle at 50% 55%,
            #29141c,
            #0c080d 45%,
            #030203 80%
        );

    opacity: 0;

    transition: opacity 1.2s;

}


.introHall.show {

    opacity: 1;

}


/* PUERTA GRANDE */

.introDoor {

    position: absolute;

    width: 240px;
    height: 390px;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    background:

        linear-gradient(
            90deg,
            #12090d,
            #32141c,
            #12090d
        );

    border:

        8px solid #080609;

    box-shadow:

        0 0 50px #000;

}


/* LÍNEA DE LA PUERTA */

.introDoor::after {

    content: "";

    position: absolute;

    width: 2px;
    height: 100%;

    background: #080608;

    left: 50%;

}


/* MANIJA */

.doorHandle {

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #a28152;

    top: 55%;

    left: 57%;

    box-shadow:

        0 0 10px
        rgba(200,160,90,.3);

}


/* PUERTA ABIÉNDOSE */

.introDoor.open {

    animation:

        doorOpen 1.8s forwards;

}


@keyframes doorOpen {

    0% {

        transform:
            translateX(-50%)
            scaleX(1);

        opacity: 1;

    }

    60% {

        transform:
            translateX(-50%)
            scaleX(.6);

    }

    100% {

        transform:
            translateX(-50%)
            scaleX(.15);

        opacity: .15;

    }

}


/* FANTASMA ??? */

.introGhost {

    position: absolute;

    width: 100px;
    height: 120px;

    left: 50%;
    bottom: 22%;

    transform:

        translateX(-50%)
        translateY(20px);

    opacity: 0;

    transition:

        opacity 1s,
        transform 1s;

}


.introGhost.show {

    opacity: 1;

    transform:

        translateX(-50%)
        translateY(0);

}


/* CABEZA DEL FANTASMA */

.ghostHead {

    position: absolute;

    width: 90px;
    height: 90px;

    left: 5px;

    border-radius:

        50% 50% 45% 45%;

    background:

        #d8d0c7;

}


/* CUERPO */

.ghostBody {

    position: absolute;

    width: 90px;
    height: 65px;

    left: 5px;
    top: 55px;

    background: #d8d0c7;

    clip-path:

        polygon(
            0 0,
            100% 0,
            100% 70%,
            85% 100%,
            70% 72%,
            55% 100%,
            40% 72%,
            25% 100%,
            0 75%
        );

}


/* OJOS */

.ghostEye {

    position: absolute;

    width: 13px;
    height: 23px;

    background: #141016;

    border-radius: 50%;

    top: 34px;

    z-index: 3;

}


.ghostEye.left {

    left: 28px;

}


.ghostEye.right {

    right: 28px;

}


/* MOÑO */

.ghostBow {

    position: absolute;

    width: 38px;
    height: 22px;

    left: 31px;
    top: 74px;

    z-index: 5;

}


.ghostBow::before,
.ghostBow::after {

    content: "";

    position: absolute;

    width: 22px;
    height: 18px;

    background: #a96476;

}


.ghostBow::before {

    left: 0;

    transform: rotate(25deg);

}


.ghostBow::after {

    right: 0;

    transform: rotate(-25deg);

}


/* TEXTO DEL FANTASMA */

#ghostDialogue {

    position: absolute;

    width: 100%;

    bottom: 7%;

    text-align: center;

    color: #d5c5bc;

    font-size: 19px;

    letter-spacing: 1px;

    opacity: 0;

    transition: opacity .7s;

}


#ghostDialogue.show {

    opacity: 1;

}

    /* ===================================== */
/* CAPÍTULO I - BOSQUE DE LOS SUSURROS */
/* ===================================== */

#chapterScreen {
    position: absolute;
    inset: 0;
    background: #030203;
    z-index: 150;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
}

#chapterScreen.show {
    display: flex;
}

.chapterContent {
    opacity: 0;
    animation: chapterAppear 1.5s forwards;
}

.chapterNumber {
    color: #a66b79;
    font-size: 17px;
    letter-spacing: 8px;
    margin-bottom: 18px;
}

.chapterTitle {
    color: #e0d1c6;
    font-size: 45px;
    letter-spacing: 5px;
}

.chapterLine {
    width: 120px;
    height: 1px;
    background: #713746;
    margin: 25px auto;
}

.chapterSubtitle {
    color: #857278;
    font-size: 14px;
    letter-spacing: 3px;
}

@keyframes chapterAppear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* ===================================== */
/* NIVEL JUGABLE */
/* ===================================== */

#forestLevel {
    position: absolute;
    inset: 0;
    overflow: hidden;
    display: none;
    background:
        linear-gradient(
            to bottom,
            #10121a 0%,
            #15121a 42%,
            #08070a 100%
        );
}

#forestLevel.active {
    display: block;
}


/* ===================================== */
/* LUNA DEL BOSQUE */
/* ===================================== */

.forestMoon {
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: #cbc9c3;
    top: 8%;
    right: 12%;
    opacity: .55;

    box-shadow:
        0 0 50px rgba(220,220,220,.12);
}


/* ===================================== */
/* MANSIÓN AL FONDO */
/* ===================================== */

.backgroundMansion {
    position: absolute;
    width: 340px;
    height: 230px;
    right: 8%;
    bottom: 27%;
    background: #09090c;
    opacity: .55;
}

.backgroundMansion::before {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    left: 45px;
    top: -120px;
    background: #09090c;
    transform: rotate(45deg);
    z-index: -1;
}


/* ===================================== */
/* BOSQUE EN CAPAS */
/* ===================================== */

.forestBack,
.forestFront {
    position: absolute;
    inset: 0;
    pointer-events: none;
}
    /* ===================================== */
/* SVG DEL BOSQUE */
/* ===================================== */

.gothicForestSVG {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    overflow: visible;

}


/* PROFUNDIDAD DEL BOSQUE */

.forestBack {

    z-index: 2;

    opacity: .95;

}


/* NAHARA Y ??? POR ENCIMA */

#naharaPlayer {

    z-index: 20;

}

#gameGhost {

    z-index: 18;

}


/* NIEBLA POR ENCIMA DE LOS ÁRBOLES */

.fogLayer {

    z-index: 6;

}


/* MANSIÓN MÁS LEJANA */

.backgroundMansion {

    z-index: 0;

}

/* ===================================== */
/* ÁRBOLES GÓTICOS RETORCIDOS */
/* ===================================== */

.tree {

    position: absolute;

    bottom: 18%;

    width: 58px;
    height: 390px;

    background:
        linear-gradient(
            90deg,
            #09080c,
            #111016 45%,
            #08070a
        );

    border-radius:
        55% 40% 8px 8px;

    transform-origin:
        center bottom;

    box-shadow:
        inset -10px 0 15px
        rgba(0,0,0,.45);

}


/* ===================================== */
/* RAMA IZQUIERDA */
/* ===================================== */

.tree::before {

    content: "";

    position: absolute;

    width: 185px;
    height: 28px;

    left: -150px;
    top: 105px;

    background:
        linear-gradient(
            to right,
            #07070a,
            #111016
        );

    border-radius:
        100% 10% 10% 100%;

    transform:
        rotate(-31deg)
        skewX(-10deg);

    transform-origin:
        right center;

}


/* ===================================== */
/* RAMA DERECHA */
/* ===================================== */

.tree::after {

    content: "";

    position: absolute;

    width: 175px;
    height: 25px;

    right: -145px;
    top: 78px;

    background:
        linear-gradient(
            to left,
            #07070a,
            #111016
        );

    border-radius:
        10% 100% 100% 10%;

    transform:
        rotate(29deg)
        skewX(12deg);

    transform-origin:
        left center;

}


/* ===================================== */
/* ÁRBOL 1 */
/* ===================================== */

.tree.one {

    left: 7%;

    height: 330px;

    width: 45px;

    opacity: .42;

    transform:
        rotate(-5deg)
        scale(.78);

    filter:
        blur(.2px);

}


/* ===================================== */
/* ÁRBOL 2 */
/* ===================================== */

.tree.two {

    left: 30%;

    height: 430px;

    width: 63px;

    opacity: .72;

    transform:
        rotate(4deg)
        scale(1.02);

}


.tree.two::before {

    top: 145px;

    width: 220px;

    left: -190px;

    transform:
        rotate(-42deg);

}


.tree.two::after {

    top: 100px;

    width: 210px;

    right: -180px;

    transform:
        rotate(36deg);

}


/* ===================================== */
/* ÁRBOL 3 */
/* ===================================== */

.tree.three {

    left: 67%;

    height: 355px;

    width: 50px;

    opacity: .5;

    transform:
        rotate(-7deg)
        scale(.86);

}


.tree.three::before {

    top: 90px;

    transform:
        rotate(-22deg);

}


.tree.three::after {

    top: 150px;

    transform:
        rotate(42deg);

}


/* ===================================== */
/* ÁRBOL 4 */
/* ===================================== */

.tree.four {

    left: 88%;

    height: 470px;

    width: 72px;

    opacity: .88;

    transform:
        rotate(6deg)
        scale(1.12);

}


.tree.four::before {

    top: 170px;

    width: 230px;

    left: -195px;

    transform:
        rotate(-38deg);

}


.tree.four::after {

    top: 100px;

    width: 220px;

    right: -190px;

    transform:
        rotate(31deg);

}




/* ===================================== */
/* NIEBLA */
/* ===================================== */

.fogLayer {
    position: absolute;
    width: 160%;
    height: 180px;
    left: -30%;
    bottom: 12%;
    opacity: .17;

    background:
        radial-gradient(
            ellipse at center,
            #d4cbd0 0%,
            transparent 65%
        );

    animation: fogMove 16s linear infinite alternate;
}

.fogLayer.second {
    bottom: 24%;
    opacity: .08;
    animation-duration: 23s;
}

@keyframes fogMove {
    from {
        transform: translateX(-5%);
    }

    to {
        transform: translateX(8%);
    }
}


/* ===================================== */
/* SUELO */
/* ===================================== */

.forestGround {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 3000px;
    height: 145px;

    background:
        linear-gradient(
            #21171c 0 8px,
            #0c090d 8px 100%
        );

    border-top: 2px solid #49303a;
}


/* ===================================== */
/* PLATAFORMAS */
/* ===================================== */

.platform {
    position: absolute;
    height: 24px;

    background:
        linear-gradient(
            #4b3238 0 5px,
            #171116 5px
        );

    border-radius: 4px 4px 0 0;

    box-shadow:
        0 10px 15px rgba(0,0,0,.4);
}

.platform.p1 {
    width: 180px;
    left: 580px;
    bottom: 220px;
}

.platform.p2 {
    width: 150px;
    left: 850px;
    bottom: 300px;
}

.platform.p3 {
    width: 190px;
    left: 1120px;
    bottom: 230px;
}


/* ===================================== */
/* LÁPIDAS */
/* ===================================== */

.grave {
    position: absolute;
    width: 55px;
    height: 75px;
    bottom: 142px;
    background: #25232a;

    border-radius:
        25px 25px 4px 4px;

    border: 2px solid #17151b;
}

.grave::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 3px;
    background: #131116;
    left: 13px;
    top: 28px;
}

.grave.g1 {
    left: 380px;
    transform: rotate(-5deg);
}

.grave.g2 {
    left: 1450px;
    transform: rotate(7deg);
}


/* ===================================== */
/* FAROL */
/* ===================================== */

.lampPost {
    position: absolute;
    width: 7px;
    height: 170px;
    left: 1700px;
    bottom: 140px;
    background: #17131a;
}

.lampPost::before {
    content: "";
    position: absolute;
    width: 42px;
    height: 50px;
    left: -18px;
    top: -35px;

    background:
        radial-gradient(
            circle,
            #b77a55,
            #4d261f 65%,
            #161015
        );

    border: 4px solid #151016;

    box-shadow:
        0 0 35px rgba(190,100,65,.22);
}


/* ===================================== */
/* NAHARA - DISEÑO CARTOON GÓTICO */
/* ===================================== */

#naharaPlayer {

    position: absolute;

    width: 64px;
    height: 108px;

    left: 180px;
    bottom: 145px;

    z-index: 20;

    transform-origin:
        center bottom;

}


/* ===================================== */
/* CABEZA */
/* ===================================== */

.naharaHead {

    position: absolute;

    width: 48px;
    height: 50px;

    left: 8px;
    top: 4px;

    border-radius:
        48% 48% 45% 45%;

    background:
        linear-gradient(
            #e3c3b2,
            #cfaa99
        );

    z-index: 4;

    box-shadow:
        inset 0 -4px 0
        rgba(90,45,48,.12);

}


/* OJOS */

.naharaHead::before {

    content: "";

    position: absolute;

    width: 7px;
    height: 11px;

    left: 12px;
    top: 23px;

    border-radius: 50%;

    background: #171117;

    box-shadow:
        18px 0 0 #171117;

}


/* BOCA */

.naharaHead::after {

    content: "";

    position: absolute;

    width: 10px;
    height: 4px;

    left: 19px;
    top: 38px;

    border-bottom:
        2px solid #7b4e52;

    border-radius: 50%;

}


/* ===================================== */
/* CABELLO */
/* ===================================== */

.naharaHair {

    position: absolute;

    width: 55px;
    height: 38px;

    left: 4px;
    top: 0;

    background:
        linear-gradient(
            145deg,
            #24151d,
            #130c11
        );

    border-radius:
        55% 52% 38% 45%;

    z-index: 5;

}


/* FLEQUILLO */

.naharaHair::before {

    content: "";

    position: absolute;

    width: 34px;
    height: 17px;

    left: 7px;
    top: 23px;

    background: #171016;

    border-radius:
        0 0 70% 25%;

    transform:
        rotate(-5deg);

}


/* MECHÓN TRASERO */

.naharaHair::after {

    content: "";

    position: absolute;

    width: 16px;
    height: 42px;

    right: 2px;
    top: 24px;

    background: #171016;

    border-radius:
        0 0 70% 70%;

    transform:
        rotate(-5deg);

    z-index: -1;

}

    height: 48px;

    left: 11px;
    top: 48px;

    top: 0;

.naharaBody::after {

    content: "";

#naharaPlayer::after {

}

        infinite;

}

            translateY(2px);

    }

#naharaPlayer.walking

        legRight
        .28s
        ease-in-out
        infinite alternate;

}

        .28s
        ease-in-out
        infinite alternate;

}

        .28s
        ease-in-out
        infinite alternate;

}

}, 29500);


/* ===================================== */
/* INICIAR BOSQUE */
/* ===================================== */

function startForest() {

    playerX = 180;

    playerY = groundHeight;

    velocityY = 0;

    jumping = false;

    cameraX = 0;

    updatePlayer();

    updateCamera();

    /*
    Los controles desaparecen solos
    después de unos segundos.
    */

    setTimeout(() => {

        controlsHint.style.opacity = "0";

    }, 6500);

}


/* ===================================== */
/* TECLADO */
/* ===================================== */

document.addEventListener(
"keydown",
function(event) {

    if (!forestStarted) {
        return;
    }

    const key =
    event.key.toLowerCase();

    keysPressed[key] = true;


    /*
    Evita que espacio y flechas
    muevan la página.
    */

    if (
        key === " " ||
        key === "arrowup" ||
        key === "arrowdown" ||
        key === "arrowleft" ||
        key === "arrowright"
    ) {

        event.preventDefault();

    }


    /*
    SALTO
    */

    if (
        (
            key === " " ||
            key === "w" ||
            key === "arrowup"
        )
        &&
        !jumping
    ) {

        velocityY = jumpPower;

        jumping = true;

    }

});


document.addEventListener(
"keyup",
function(event) {

    keysPressed[
        event.key.toLowerCase()
    ] = false;

});


/* ===================================== */
/* MOVIMIENTO */
/* ===================================== */

function movePlayer() {

    if (!forestStarted) {
        return;
    }
    /* ESTADO DE ANIMACIÓN */

const movingLeft =
keysPressed["a"] ||
keysPressed["arrowleft"];

const movingRight =
keysPressed["d"] ||
keysPressed["arrowright"];

if (movingLeft || movingRight) {

    naharaPlayer.classList.add(
        "walking"
    );

} else {

    naharaPlayer.classList.remove(
        "walking"
    );

}

if (jumping) {

    naharaPlayer.classList.add(
        "jumping"
    );

} else {

    naharaPlayer.classList.remove(
        "jumping"
    );

}


    /*
    IZQUIERDA
    */

    if (
        keysPressed["a"] ||
        keysPressed["arrowleft"]
    ) {

        playerX -= moveSpeed;

        /*
        Nahara mira hacia la izquierda.
        */

        naharaPlayer.style.transform =
        "scaleX(-1)";

    }


    /*
    DERECHA
    */

    if (
        keysPressed["d"] ||
        keysPressed["arrowright"]
    ) {

        playerX += moveSpeed;

        naharaPlayer.style.transform =
        "scaleX(1)";

    }


    /*
    LÍMITES DEL NIVEL
    */

    if (playerX < 40) {
        playerX = 40;
    }

    if (playerX > 2700) {
        playerX = 2700;
    }


    /* ================================= */
    /* GRAVEDAD */
    /* ================================= */

    if (jumping) {

        playerY += velocityY;

        velocityY -= gravity;


        if (playerY <= groundHeight) {

            playerY = groundHeight;

            velocityY = 0;

            jumping = false;
            naharaPlayer.classList.remove(
    "jumping"
);

        }

    }


    updatePlayer();

    updateCamera();

    checkForestEvents();

}


/* ===================================== */
/* ACTUALIZAR NAHARA */
/* ===================================== */

function updatePlayer() {

    naharaPlayer.style.left =
    (playerX - cameraX) + "px";

    naharaPlayer.style.bottom =
    playerY + "px";

}


/* ===================================== */
/* CÁMARA LATERAL */
/* ===================================== */

function updateCamera() {

    const screenWidth =
    window.innerWidth;


    /*
    La cámara empieza a seguir a Nahara
    cuando se acerca al centro.
    */

    cameraX =
    playerX - screenWidth * 0.35;


    if (cameraX < 0) {
        cameraX = 0;
    }


    const maxCamera =
    3000 - screenWidth;


    if (cameraX > maxCamera) {
        cameraX = Math.max(0, maxCamera);
    }


    forestWorld.style.transform =
    "translateX(" + (-cameraX) + "px)";


    /*
    El fantasma sigue a Nahara,
    pero ligeramente detrás.
    */

    let ghostScreenX =
    playerX - cameraX - 75;


    if (ghostScreenX < 25) {
        ghostScreenX = 25;
    }


    gameGhost.style.left =
    ghostScreenX + "px";


    gameGhost.style.bottom =
    (playerY + 65) + "px";

}


/* ===================================== */
/* EVENTOS DEL BOSQUE */
/* ===================================== */

function checkForestEvents() {


    /* ================================= */
    /* NAHARA PASA LA MUÑECA */
    /* ================================= */

    if (
        playerX > 900 &&
        !dollPassed
    ) {

        dollPassed = true;

    }


    /*
    Si ya pasó la muñeca
    y decide regresar...
    desapareció.
    */

    if (
        dollPassed &&
        playerX < 720 &&
        !dollGone
    ) {

        dollGone = true;

        creepyDoll.style.opacity = "0";

        creepyDoll.style.transition =
        "opacity .15s";


        showGhostMessage(
            "???: ..."
        );


        setTimeout(() => {

            showGhostMessage(
                "???: Esa cosa estaba sentada ahí."
            );

        }, 1700);


        setTimeout(() => {

            showGhostMessage(
                "???: Sigue caminando."
            );

        }, 4200);

    }


    /* ================================= */
    /* PRIMER GATO */
    /* ================================= */

    if (
        playerX > 1160 &&
        playerX < 1300 &&
        playerY > 200 &&
        !catCollected
    ) {

        catCollected = true;

        firstCat.style.display =
        "none";


        showGhostMessage(
            "???: Encontraste un gato."
        );


        setTimeout(() => {

            showGhostMessage(
                "???: ...¿Por qué hay tantos gatos en esta casa?"
            );

        }, 2200);

    }

}


/* ===================================== */
/* MENSAJES DE ??? DURANTE EL JUEGO */
/* ===================================== */

let forestMessage = null;


function createForestMessage() {

    forestMessage =
    document.createElement("div");

    forestMessage.id =
    "forestGhostMessage";


    forestMessage.style.position =
    "absolute";

    forestMessage.style.left =
    "50%";

    forestMessage.style.bottom =
    "12%";

    forestMessage.style.transform =
    "translateX(-50%)";

    forestMessage.style.padding =
    "13px 25px";

    forestMessage.style.background =
    "rgba(4,3,5,.82)";

    forestMessage.style.border =
    "1px solid rgba(150,90,110,.35)";

    forestMessage.style.color =
    "#d8cbc3";

    forestMessage.style.fontSize =
    "17px";

    forestMessage.style.letterSpacing =
    "1px";

    forestMessage.style.zIndex =
    "80";

    forestMessage.style.opacity =
    "0";

    forestMessage.style.transition =
    "opacity .4s";

    forestMessage.style.pointerEvents =
    "none";


    forestLevel.appendChild(
        forestMessage
    );

}


function showGhostMessage(text) {

    if (!forestMessage) {

        createForestMessage();

    }


    forestMessage.innerText =
    text;

    forestMessage.style.opacity =
    "1";


    clearTimeout(
        forestMessage.hideTimer
    );


    forestMessage.hideTimer =
    setTimeout(() => {

        forestMessage.style.opacity =
        "0";

    }, 3500);

}


/* ===================================== */
/* ANIMACIÓN PRINCIPAL */
/* ===================================== */

function gameLoop() {

    movePlayer();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* ===================================== */
/* AJUSTAR CÁMARA SI CAMBIA LA PANTALLA */
/* ===================================== */

window.addEventListener(
"resize",
function() {

    if (forestStarted) {

        updateCamera();

    }

});


</script>
