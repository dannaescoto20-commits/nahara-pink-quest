<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Mansión Encantada de Nahara</title>
  <link rel="stylesheet" href="style.css">


  
</head>

<body>

<div class="scene" id="scene">

<div class="stars"></div>

<div class="moon"></div>

<div class="bat b1">🦇</div>
<div class="bat b2">🦇</div>
<div class="bat b3">🦇</div>

<div class="intro">

<div class="small">
UNA AVENTURA DE CUMPLEAÑOS
</div>

<h1>
LA MANSIÓN<br>
<span>DE NAHARA</span>
</h1>

<div class="subtitle">
Algo te está esperando dentro...
</div>

</div>

<div class="ground"></div>

<div class="ghost g1">👻</div>
<div class="ghost g2">👻</div>

<div class="house">

<div class="tower"></div>
<div class="towerRoof"></div>

<div class="main-house">

<div class="window w1"></div>
<div class="window w2"></div>
<div class="window w3"></div>
<div class="window w4"></div>

<div class="door" onclick="enterHouse()"></div>

</div>

<div class="window tw"></div>

<div class="roof"></div>

</div>

<div class="cat">🐈‍⬛</div>

<button class="start" onclick="enterHouse()">
♡ ENTRAR A LA MANSIÓN ♡
</button>

</div>


<!-- SEGUNDA ESCENA -->

<div class="message" id="message">

<div class="guide">👻</div>

<div class="dialogue">

<strong>???</strong>

<p>
¡Nahara! Por fin llegaste...
</p>

<p>
Llevo toda la noche esperándote.
</p>

<button class="continue" onclick="nextDialogue()">
CONTINUAR ♡
</button>

</div>

</div>


<script>

let dialogue = 0;

function enterHouse(){

document.getElementById("scene").style.transition="1.3s";

document.getElementById("scene").style.transform="scale(1.35)";

document.getElementById("scene").style.opacity="0";

setTimeout(function(){

document.getElementById("message").classList.add("show");

},900);

}

function nextDialogue(){

const box=document.querySelector(".dialogue");

dialogue++;

if(dialogue===1){

box.innerHTML=`

<strong>???</strong>

<p>
Tenemos un pequeño problema...
</p>

<p>
Los habitantes de la mansión escondieron
<strong>cuatro llaves</strong> antes de tu fiesta.
</p>

<button class="continue" onclick="nextDialogue()">
¿CUATRO LLAVES? 👀
</button>

`;

}

else if(dialogue===2){

box.innerHTML=`

<strong>???</strong>

<p>
Sip. 🔑
</p>

<p>
Vampiros, criaturas, fantasmas...
</p>

<p>
Ya sabes cómo son.
</p>

<button class="continue" onclick="nextDialogue()">
¿Y AHORA QUÉ? ♡
</button>

`;

}

else{

box.innerHTML=`

<strong>???</strong>

<p>
Encuentra las cuatro llaves antes de medianoche.
</p>

<p>
Y quizá descubras qué están preparando
para ti...
</p>

<button class="continue" onclick="startAdventure()">
COMENZAR AVENTURA 👻
</button>

`;
}

}

function startAdventure(){

  const message = document.getElementById("message");

  message.innerHTML = `
    <div class="clockScene">

      <div class="clockTime">
        11:00 P.M.
      </div>

      <div class="clockText">
        La mansión ha despertado.
      </div>

      <div class="clockHint">
        🕰️
      </div>

    </div>
  `;

  setTimeout(() => {
    document.body.classList.add("flicker");
  }, 1500);

  setTimeout(() => {
    document.body.classList.remove("flicker");
  }, 1900);

  setTimeout(() => {
    document.body.classList.add("flicker");
  }, 2300);

  setTimeout(() => {
    document.body.classList.remove("flicker");
  }, 2500);

  setTimeout(() => {
    showVecnaJoke();
  }, 3400);
}


function showVecnaJoke(){

  const message = document.getElementById("message");

  message.innerHTML = `
    <div class="guide">👻</div>

    <div class="dialogue">

      <strong>???</strong>

      <p>...</p>

      <p>No.</p>

      <p>Ni se te ocurra decirlo.</p>

      <button class="continue" onclick="vecnaAnswer()">
        ES VECNA 😭
      </button>

    </div>
  `;
}


function vecnaAnswer(){

  const message = document.getElementById("message");

  message.innerHTML = `
    <div class="guide">👻</div>

    <div class="dialogue">

      <strong>???</strong>

      <p>Sabía que ibas a decir eso.</p>

      <p>🙄</p>

      <button class="continue" onclick="enterHall()">
        SEGUIR CAMINANDO 🕯️
      </button>

    </div>
  `;
}


function enterHall(){

  const message = document.getElementById("message");

  message.innerHTML = `
   <div class="hall">

  <div class="hud">
    <span>🔑 0/4</span>
    <span>🐈‍⬛ 0/9</span>
    <span>🕰️ 11:00 P.M.</span>
  </div>

  <div class="lightning lightningOne"></div>
  <div class="lightning lightningTwo"></div>

  <div class="chandelier">
    🕯️ <span>🕯️</span> <span>🕯️</span>
  </div>

  <div class="hallTitle">
    VESTÍBULO PRINCIPAL
  </div>

  <div class="hallSubtitle">
    La mansión guarda silencio.
  </div>

  <div class="upperFloor">

    <button class="midnightDoor lockedDoor">

      <span class="doorLocks">
        🔒 🔒 🔒 🔒
      </span>

      <strong>
        SALÓN DE MEDIANOCHE
      </strong>

      <small>
        La puerta no responde.
      </small>

    </button>

  </div>


  <div class="stairs">

    <div class="stairRail leftRail"></div>
    <div class="stairRail rightRail"></div>

    <div class="stairsCenter">
      <div class="step step1"></div>
      <div class="step step2"></div>
      <div class="step step3"></div>
      <div class="step step4"></div>
      <div class="step step5"></div>
      <div class="step step6"></div>
    </div>

  </div>


  <div class="hallFloor">

    <button
      class="mansionDoor available"
      onclick="showCinemaDoor()"
    >

      <div class="doorArch"></div>
      <div class="doorHandle"></div>

      <span class="doorIcon">
        🎬
      </span>

    </button>


    <div class="centerRug"></div>


    <button class="mansionDoor locked">

      <div class="doorArch"></div>
      <div class="doorHandle"></div>

      <span class="doorIcon">
        🧛
      </span>

      <span class="lockMark">
        🔒
      </span>

    </button>

  </div>


  <div class="sideObjects">

    <button
      class="portrait"
      onclick="portraitClick()"
    >
      👁️
    </button>

    <button
      class="grandClock"
      onclick="clockClick()"
    >
      🕰️
    </button>

  </div>


  <div
    class="ghostHall"
    onclick="ghostHint()"
  >
    👻
  </div>


  <div
    class="hallCat"
    id="hallCat"
  >
    🐈‍⬛
  </div>

</div>
  `;
}

  function showCinemaDoor(){

  const message = document.getElementById("message");

  message.innerHTML += `
    <div class="doorPopup" id="doorPopup">

      <div class="popupCard">

        <div class="popupIcon">🎬</div>

        <h2>CINE MALDITO</h2>

        <p>
          Se escucha un proyector funcionando
          al otro lado.
        </p>

        <button class="continue" onclick="closeDoorPopup()">
          TODAVÍA NO ENTRAR
        </button>

      </div>

    </div>
  `;
}


function closeDoorPopup(){

  const popup = document.getElementById("doorPopup");

  if(popup){
    popup.remove();
  }

}


function ghostHint(){

  alert("👻 ???: La puerta de la izquierda parece menos peligrosa. Eso no significa que sea segura.");

}


function portraitClick(){

  const messages = [
    "El retrato parece normal.",
    "¿Los ojos siempre estaban mirando hacia aquí?",
    "Algo se movió detrás del marco.",
    "No pasa nada... creo."
  ];

  alert(messages[Math.floor(Math.random() * messages.length)]);

}


function clockClick(){

  const messages = [
    "DONG...",
    "El reloj está detenido.",
    "11:00 P.M.",
    "No parece buena idea tocarlo."
  ];

  alert(messages[Math.floor(Math.random() * messages.length)]);

}
</script>

</body>
</html>
