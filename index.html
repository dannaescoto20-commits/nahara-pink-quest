<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>La Mansión de Nahara</title>

<style>

/* ============================= */
/* BASE DEL JUEGO */
/* ============================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050407;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    color: #eadfd5;
}


/* ============================= */
/* PANTALLA DEL JUEGO */
/* ============================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 20%,
            #24202a 0%,
            #111017 40%,
            #050407 75%
        );

}


/* ============================= */
/* LLUVIA */
/* ============================= */

.rain {

    position: absolute;

    width: 100%;
    height: 100%;

    pointer-events: none;

    opacity: .28;

    background-image:

        repeating-linear-gradient(
            110deg,
            transparent 0px,
            transparent 18px,
            rgba(200,220,230,.4) 19px,
            transparent 20px,
            transparent 40px
        );

    animation: rainMove .35s linear infinite;

}

@keyframes rainMove {

    from {
        transform: translateY(-30px);
    }

    to {
        transform: translateY(30px);
    }

}


/* ============================= */
/* LUNA */
/* ============================= */

.moon {

    position: absolute;

    width: 150px;
    height: 150px;

    left: 12%;
    top: 10%;

    border-radius: 50%;

    background: #d9d9d4;

    box-shadow:
        0 0 30px rgba(220,220,220,.25),
        0 0 90px rgba(190,200,220,.15);

}


/* ============================= */
/* MONTAÑAS / BOSQUE */
/* ============================= */

.mountain {

    position: absolute;

    bottom: 0;

    width: 100%;
    height: 48%;

    background:

        linear-gradient(
            145deg,
            transparent 40%,
            #08080c 41%
        ),

        linear-gradient(
            215deg,
            transparent 45%,
            #0b090e 46%
        );

}


/* ============================= */
/* MANSIÓN */
/* ============================= */

.mansion {

    position: absolute;

    width: 520px;
    height: 340px;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    background: #0b0a0e;

    border: 2px solid #17131a;

    box-shadow:
        0 0 80px rgba(0,0,0,.9);

}


/* TECHO */

.mansion::before {

    content: "";

    position: absolute;

    width: 420px;
    height: 210px;

    left: 50%;
    top: -145px;

    transform:
        translateX(-50%)
        rotate(45deg);

    background: #09090d;

    z-index: -1;

}


/* ============================= */
/* TORRES */
/* ============================= */

.tower {

    position: absolute;

    width: 110px;
    height: 420px;

    bottom: 0;

    background: #09090d;

}

.tower.left {
    left: -90px;
}

.tower.right {
    right: -90px;
}


/* ============================= */
/* VENTANAS */
/* ============================= */

.window {

    position: absolute;

    width: 45px;
    height: 75px;

    background: #17141a;

    border:

        4px solid #08070a;

    border-radius:

        30px 30px 0 0;

    overflow: hidden;

}


/* POSICIONES */

.window.w1 {
    left: 70px;
    top: 80px;
}

.window.w2 {
    left: 180px;
    top: 65px;
}

.window.w3 {
    right: 180px;
    top: 65px;
}

.window.w4 {
    right: 70px;
    top: 80px;
}


/* VENTANA ENCENDIDA */

.window.light {

    background:

        radial-gradient(
            circle,
            #b87657,
            #55251e 60%,
            #1a0d0d
        );

    box-shadow:

        0 0 25px
        rgba(180,90,60,.3);

}


/* ============================= */
/* FIGURA EN LA VENTANA */
/* ============================= */

.figure {

    position: absolute;

    width: 17px;
    height: 45px;

    bottom: 0;
    left: 14px;

    background: #050506;

    border-radius:

        50% 50% 20% 20%;

    opacity: 0;

}

.figure.show {

    opacity: 1;

}


/* ============================= */
/* PUERTA */
/* ============================= */

.door {

    position: absolute;

    width: 80px;
    height: 135px;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    background:

        linear-gradient(
            90deg,
            #120b0d,
            #261116,
            #120b0d
        );

    border:

        4px solid #080608;

}


/* ============================= */
/* TÍTULO */
/* ============================= */

.title {

    position: absolute;

    width: 100%;

    top: 12%;

    text-align: center;

    z-index: 10;

    text-shadow:

        0 5px 20px #000;

}


.title-small {

    font-size: 22px;

    letter-spacing: 8px;

}


.title-main {

    font-size: 72px;

    letter-spacing: 5px;

    margin-top: 5px;

}


.title-name {

    font-size: 30px;

    letter-spacing: 8px;

    color: #c79aa4;

}


.subtitle {

    margin-top: 16px;

    font-size: 15px;

    letter-spacing: 4px;

    color: #9e858b;

}


/* ============================= */
/* BOTÓN ENTRAR */
/* ============================= */

.enter {

    position: absolute;

    left: 50%;
    bottom: 17%;

    transform: translateX(-50%);

    padding:

        16px 65px;

    color: #e7d7ce;

    background:

        rgba(15,8,11,.9);

    border:

        1px solid #75434f;

    font-family: Georgia;

    letter-spacing: 4px;

    cursor: pointer;

    transition: .25s;

    z-index: 20;

}


.enter:hover {

    background: #35121c;

    border-color: #b47482;

    box-shadow:

        0 0 25px
        rgba(150,70,90,.25);

}


/* ============================= */
/* RELÁMPAGO */
/* ============================= */

#lightning {

    position: absolute;

    width: 100%;
    height: 100%;

    background: #dce4eb;

    opacity: 0;

    pointer-events: none;

    z-index: 50;

}


.flash {

    animation:

        lightningFlash .5s;

}


@keyframes lightningFlash {

    0% {
        opacity: 0;
    }

    10% {
        opacity: .7;
    }

    20% {
        opacity: .1;
    }

    30% {
        opacity: .4;
    }

    100% {
        opacity: 0;
    }

}

/* ============================= */
/* INTRO CINEMÁTICA */
/* ============================= */

#introScene {

    position: absolute;

    inset: 0;

    background: #050407;

    display: none;

    z-index: 100;

    overflow: hidden;

}


#introScene.active {

    display: block;

}


/* TEXTO DE LA INTRO */

.introText {

    position: absolute;

    width: 100%;

    top: 50%;

    transform: translateY(-50%);

    text-align: center;

    font-size: 34px;

    letter-spacing: 7px;

    color: #d8c9c0;

    opacity: 0;

    transition: opacity 1s;

}


.introText.show {

    opacity: 1;

}


/* PASILLO OSCURO */

.introHall {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.8)
        ),

        radial-gradient(
            circle at 50% 55%,
            #29141c,
            #0c080d 45%,
            #030203 80%
        );

    opacity: 0;

    transition: opacity 1.2s;

}


.introHall.show {

    opacity: 1;

}


/* PUERTA GRANDE */

.introDoor {

    position: absolute;

    width: 240px;
    height: 390px;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    background:

        linear-gradient(
            90deg,
            #12090d,
            #32141c,
            #12090d
        );

    border:

        8px solid #080609;

    box-shadow:

        0 0 50px #000;

}


/* LÍNEA DE LA PUERTA */

.introDoor::after {

    content: "";

    position: absolute;

    width: 2px;
    height: 100%;

    background: #080608;

    left: 50%;

}


/* MANIJA */

.doorHandle {

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #a28152;

    top: 55%;

    left: 57%;

    box-shadow:

        0 0 10px
        rgba(200,160,90,.3);

}


/* PUERTA ABIÉNDOSE */

.introDoor.open {

    animation:

        doorOpen 1.8s forwards;

}


@keyframes doorOpen {

    0% {

        transform:
            translateX(-50%)
            scaleX(1);

        opacity: 1;

    }

    60% {

        transform:
            translateX(-50%)
            scaleX(.6);

    }

    100% {

        transform:
            translateX(-50%)
            scaleX(.15);

        opacity: .15;

    }

}


/* FANTASMA ??? */

.introGhost {

    position: absolute;

    width: 100px;
    height: 120px;

    left: 50%;
    bottom: 22%;

    transform:

        translateX(-50%)
        translateY(20px);

    opacity: 0;

    transition:

        opacity 1s,
        transform 1s;

}


.introGhost.show {

    opacity: 1;

    transform:

        translateX(-50%)
        translateY(0);

}


/* CABEZA DEL FANTASMA */

.ghostHead {

    position: absolute;

    width: 90px;
    height: 90px;

    left: 5px;

    border-radius:

        50% 50% 45% 45%;

    background:

        #d8d0c7;

}


/* CUERPO */

.ghostBody {

    position: absolute;

    width: 90px;
    height: 65px;

    left: 5px;
    top: 55px;

    background: #d8d0c7;

    clip-path:

        polygon(
            0 0,
            100% 0,
            100% 70%,
            85% 100%,
            70% 72%,
            55% 100%,
            40% 72%,
            25% 100%,
            0 75%
        );

}


/* OJOS */

.ghostEye {

    position: absolute;

    width: 13px;
    height: 23px;

    background: #141016;

    border-radius: 50%;

    top: 34px;

    z-index: 3;

}


.ghostEye.left {

    left: 28px;

}


.ghostEye.right {

    right: 28px;

}


/* MOÑO */

.ghostBow {

    position: absolute;

    width: 38px;
    height: 22px;

    left: 31px;
    top: 74px;

    z-index: 5;

}


.ghostBow::before,
.ghostBow::after {

    content: "";

    position: absolute;

    width: 22px;
    height: 18px;

    background: #a96476;

}


.ghostBow::before {

    left: 0;

    transform: rotate(25deg);

}


.ghostBow::after {

    right: 0;

    transform: rotate(-25deg);

}


/* TEXTO DEL FANTASMA */

#ghostDialogue {

    position: absolute;

    width: 100%;

    bottom: 7%;

    text-align: center;

    color: #d5c5bc;

    font-size: 19px;

    letter-spacing: 1px;

    opacity: 0;

    transition: opacity .7s;

}


#ghostDialogue.show {

    opacity: 1;

}
/* ============================= */
/* RESPONSIVE */
/* ============================= */

@media(max-width:700px) {

    .title-main {
        font-size: 45px;
    }

    .mansion {

        transform:

            translateX(-50%)
            scale(.72);

        transform-origin: bottom;

    }

}

</style>
</head>


<body>


<div id="game">


<!-- LUNA -->

<div class="moon"></div>


<!-- MONTAÑAS -->

<div class="mountain"></div>


<!-- MANSIÓN -->

<div class="mansion">


<div class="tower left"></div>

<div class="tower right"></div>


<div class="window w1"></div>

<div class="window w2 light">

<div
class="figure"
id="windowFigure">
</div>

</div>

<div class="window w3"></div>

<div class="window w4"></div>


<div class="door"></div>


</div>


<!-- LLUVIA -->

<div class="rain"></div>


<!-- TÍTULO -->

<div class="title">

<div class="title-small">

LA

</div>


<div class="title-main">

MANSIÓN

</div>


<div class="title-name">

DE NAHARA

</div>


<div class="subtitle">

ALGUIEN TE ESTÁ ESPERANDO.

</div>


</div>


<!-- BOTÓN -->

<button
class="enter"
id="enterButton">

ENTRAR

</button>


<!-- RELÁMPAGO -->

<div id="lightning"></div>
    <!-- ============================= -->
<!-- INTRO CINEMÁTICA -->
<!-- ============================= -->

<div id="introScene">


<div
class="introHall"
id="introHall">


<div
class="introDoor"
id="introDoor">

<div class="doorHandle"></div>

</div>


</div>


<div
class="introText"
id="arrivalText">

NAHARA. LLEGASTE.

</div>



<div
class="introGhost"
id="introGhost">


<div class="ghostHead"></div>

<div class="ghostBody"></div>


<div
class="ghostEye left">
</div>


<div
class="ghostEye right">
</div>


<div class="ghostBow"></div>


</div>



<div id="ghostDialogue">

???: Pensé que no vendrías.

</div>


</div>


</div>



<script>


/* ============================= */
/* RELÁMPAGOS */
/* ============================= */


const lightning =
document.getElementById(
"lightning"
);


const figure =
document.getElementById(
"windowFigure"
);



function thunderStorm() {


let delay =

4000 +

Math.random()
* 7000;



setTimeout(() => {


lightning.classList.add(
"flash"
);



/* A VECES APARECE ALGUIEN */


if(
Math.random() < .45
){

figure.classList.add(
"show"
);

}



setTimeout(() => {

figure.classList.remove(
"show"
);

},700);



setTimeout(() => {

lightning.classList.remove(
"flash"
);

},500);



thunderStorm();


},delay);


}



thunderStorm();



/* ============================= */
/* BOTÓN ENTRAR */
/* ============================= */


/* ============================= */
/* INTRO AL PRESIONAR ENTRAR */
/* ============================= */


const enterButton =
document.getElementById(
"enterButton"
);


const introScene =
document.getElementById(
"introScene"
);


const introHall =
document.getElementById(
"introHall"
);


const introDoor =
document.getElementById(
"introDoor"
);


const arrivalText =
document.getElementById(
"arrivalText"
);


const introGhost =
document.getElementById(
"introGhost"
);


const ghostDialogue =
document.getElementById(
"ghostDialogue"
);



enterButton.addEventListener(
"click",
function(){


/* DESAPARECE EL BOTÓN */

enterButton.style.display =
"none";


/* DESAPARECE EL TÍTULO */

document
.querySelector(
".title"
)
.style.display =
"none";



/* RELÁMPAGO FUERTE */

lightning
.classList
.add(
"flash"
);



setTimeout(() => {


lightning
.classList
.remove(
"flash"
);


/* MOSTRAMOS LA INTRO */

introScene
.classList
.add(
"active"
);


},500);



/* APARECE EL PASILLO */

setTimeout(() => {


introHall
.classList
.add(
"show"
);


},900);



/* LA PUERTA SE ABRE */

setTimeout(() => {


introDoor
.classList
.add(
"open"
);


},2300);



/* TODO SE OSCURECE */

setTimeout(() => {


introHall.style.opacity =
"0";


},4300);



/* TEXTO NAHARA LLEGASTE */

setTimeout(() => {


arrivalText
.classList
.add(
"show"
);


},5200);



/* DESAPARECE EL TEXTO */

setTimeout(() => {


arrivalText
.classList
.remove(
"show"
);


},7600);



/* APARECE ??? */

setTimeout(() => {


introGhost
.classList
.add(
"show"
);


},8500);



/* PRIMER DIÁLOGO */

setTimeout(() => {


ghostDialogue
.classList
.add(
"show"
);


},9600);



/* SEGUNDO DIÁLOGO */

setTimeout(() => {


ghostDialogue.innerText =
"???: Esta casa lleva mucho tiempo esperándote.";


},12500);



/* TERCER DIÁLOGO */

setTimeout(() => {


ghostDialogue.innerText =
"???: Hay cuatro llaves escondidas aquí.";


},15800);



/* CUARTO DIÁLOGO */

setTimeout(() => {


ghostDialogue.innerText =
"???: Consíguelas antes de medianoche.";


},19000);



/* ÚLTIMA FRASE */

setTimeout(() => {


ghostDialogue.innerText =
"???: Y Nahara... intenta no separarte de mí.";


},22000);



});



</script>


</body>

</html>
